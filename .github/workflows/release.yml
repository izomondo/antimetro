name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: Antimetro-Windows-x64
            ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: Antimetro-macOS-arm64
            ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: Antimetro-macOS-x64
            ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: Antimetro-Linux-x64
            ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/antimetro.exe" "dist/antimetro.exe"
          Copy-Item "assets/logo.svg" "dist/logo.svg"
          Copy-Item "installers/Install.bat" "dist/Install.bat"
          Copy-Item "installers/Uninstall.bat" "dist/Uninstall.bat"
          Copy-Item "LICENSE" "dist/LICENSE"
          Copy-Item "NOTICE" "dist/NOTICE"
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Package macOS archive
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/antimetro" "dist/antimetro"
          chmod +x "dist/antimetro"
          cp "assets/logo.svg" "dist/logo.svg"
          cp "installers/Install.command" "dist/Install.command"
          cp "installers/Uninstall.command" "dist/Uninstall.command"
          chmod +x "dist/Install.command" "dist/Uninstall.command"
          cp "LICENSE" "dist/LICENSE"
          cp "NOTICE" "dist/NOTICE"
          cd dist && zip -r "../${{ matrix.artifact }}.zip" .

      - name: Package Linux archive
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/antimetro" "dist/antimetro"
          chmod +x "dist/antimetro"
          cp "assets/logo.svg" "dist/logo.svg"
          cp "installers/Install.command" "dist/install.sh"
          cp "installers/Uninstall.command" "dist/uninstall.sh"
          chmod +x "dist/install.sh" "dist/uninstall.sh"
          cp "LICENSE" "dist/LICENSE"
          cp "NOTICE" "dist/NOTICE"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .

      - name: Attach archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ matrix.artifact }}.${{ matrix.ext }}"
