name: Release Binaries
run-name: "Release Antimetro ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - label: macOS-arm64-and-x64
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - label: Linux-x64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Build and package Windows (x64)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Path dist, out -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/antimetro.exe" "dist/antimetro.exe"
          Copy-Item "assets/logo.svg" "dist/logo.svg"
          Copy-Item "installers/Install.bat" "dist/Install.bat"
          Copy-Item "installers/Uninstall.bat" "dist/Uninstall.bat"
          Copy-Item "LICENSE" "dist/LICENSE"
          Copy-Item "NOTICE" "dist/NOTICE"
          Compress-Archive -Path "dist/*" -DestinationPath "out/Antimetro-Windows-x64.zip" -Force

      - name: Build and package macOS (arm64 + x64)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          mkdir -p out
          for pair in "aarch64-apple-darwin:Antimetro-macOS-arm64" "x86_64-apple-darwin:Antimetro-macOS-x64"; do
            target="${pair%%:*}"
            artifact="${pair##*:}"
            cargo build --release --target "${target}"
            rm -rf dist
            mkdir -p dist
            cp "target/${target}/release/antimetro" "dist/antimetro"
            chmod +x "dist/antimetro"
            cp "assets/logo.svg" "dist/logo.svg"
            cp "installers/Install.command" "dist/Install.command"
            cp "installers/Uninstall.command" "dist/Uninstall.command"
            chmod +x "dist/Install.command" "dist/Uninstall.command"
            cp "LICENSE" "dist/LICENSE"
            cp "NOTICE" "dist/NOTICE"
            (cd dist && zip -r "../out/${artifact}.zip" .)
          done

      - name: Build and package Linux (x64 static musl)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p dist out
          cp "target/x86_64-unknown-linux-musl/release/antimetro" "dist/antimetro"
          chmod +x "dist/antimetro"
          cp "assets/logo.svg" "dist/logo.svg"
          cp "installers/Install.command" "dist/install.sh"
          cp "installers/Uninstall.command" "dist/uninstall.sh"
          chmod +x "dist/install.sh" "dist/uninstall.sh"
          cp "LICENSE" "dist/LICENSE"
          cp "NOTICE" "dist/NOTICE"
          tar -czf "out/Antimetro-Linux-x64.tar.gz" -C dist .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          path: out/*
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all platform archives
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          tag = os.environ["TAG_NAME"].strip()
          repo = os.environ["GITHUB_REPOSITORY"].strip()
          changelog = pathlib.Path("CHANGELOG.md")
          notes = ""

          if changelog.is_file():
              lines = changelog.read_text(encoding="utf-8").splitlines()
              header_re = re.compile(r"^##\s+" + re.escape(tag) + r"(?:\b|\s|$)")
              capture = False
              buf = []
              for line in lines:
                  if not capture:
                      if header_re.match(line):
                          capture = True
                      continue
                  if re.match(r"^---\s*$", line) or re.match(r"^##\s+v", line):
                      break
                  buf.append(line)
              notes = "\n".join(buf).strip()

          if notes:
              notes += f"\n\n---\nFull changelog: [CHANGELOG.md](https://github.com/{repo}/blob/main/CHANGELOG.md)\n"
              pathlib.Path("release_notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TITLE="Antimetro ${TAG_NAME}"
          if [ -f release_notes.md ]; then
            if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release edit "${TAG_NAME}" --title "${TITLE}" --notes-file release_notes.md
              gh release upload "${TAG_NAME}" release-assets/* --clobber
            else
              gh release create "${TAG_NAME}" release-assets/* --title "${TITLE}" --notes-file release_notes.md
            fi
          else
            if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release upload "${TAG_NAME}" release-assets/* --clobber
            else
              gh release create "${TAG_NAME}" release-assets/* --title "${TITLE}" --generate-notes
            fi
          fi
