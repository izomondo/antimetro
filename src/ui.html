  /* Left Dot Scrollbar (Antigravity style) */
  function syncDots(viewport, dotsEl) {
    if (!viewport || !dotsEl) return;
    const overflow = viewport.scrollHeight - viewport.clientHeight;
    if (overflow <= 2) {
      dotsEl.classList.remove("visible");
      dotsEl.dataset.count = "0";
      dotsEl.innerHTML = "";
      return;
    }
    const items = Array.from(viewport.children).filter(
      (el) => el.classList.contains("note-block") || el.classList.contains("search-block")
    );
    if (items.length <= 1) {
      dotsEl.classList.remove("visible");
      return;
    }

    dotsEl.classList.add("visible");
    const count = Math.min(items.length, 14);
    if (dotsEl.dataset.count !== String(count)) {
      dotsEl.dataset.count = String(count);
      dotsEl.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "cards-dot";
        dot.tabIndex = -1;
        dot.addEventListener("click", (e) => {
          e.stopPropagation();
          const liveItems = Array.from(viewport.children).filter(
            (el) => el.classList.contains("note-block") || el.classList.contains("search-block")
          );
          const liveCount = Math.min(liveItems.length, 14);
          const maxScroll = Math.max(0, viewport.scrollHeight - viewport.clientHeight);
          if (liveItems.length === liveCount) {
            const target = liveItems[i];
            if (target) {
              viewport.scrollTo({ top: Math.min(maxScroll, target.offsetTop), behavior: "smooth" });
            }
          } else {
            const ratio = liveCount > 1 ? i / (liveCount - 1) : 0;
            viewport.scrollTo({ top: Math.round(maxScroll * ratio), behavior: "smooth" });
          }
        });
        dotsEl.appendChild(dot);
      }
    }

    const maxScroll = Math.max(1, viewport.scrollHeight - viewport.clientHeight);
    let activeIdx = 0;
    if (viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 3) {
      activeIdx = count - 1;
    } else if (items.length === count) {
      let best = 0;
      for (let i = 0; i < items.length; i++) {
        if (items[i].offsetTop <= viewport.scrollTop + 28) {
          best = i;
        } else {
          break;
        }
      }
      activeIdx = best;
    } else {
      activeIdx = Math.round((viewport.scrollTop / maxScroll) * (count - 1));
    }

    const dots = dotsEl.querySelectorAll(".cards-dot");
    dots.forEach((d, idx) => d.classList.toggle("active", idx === activeIdx));
  }

  function bindDotViewport(viewportId, dotsId) {
    const vp = $(viewportId);
    const dots = $(dotsId);
    vp.addEventListener("scroll", () => syncDots(vp, dots), { passive: true });
    if (typeof ResizeObserver === "function") {
      const ro = new ResizeObserver(() => syncDots(vp, dots));
      ro.observe(vp);
    }
  }
  bindDotViewport("notes-viewport", "notes-dots");
  bindDotViewport("search-viewport", "search-dots");

  function bindAutoHideScrollbar(el) {
    if (!el || el._hasAutoSb) return;
    el._hasAutoSb = true;
    el.addEventListener("scroll", () => {
      if (el.scrollHeight <= el.clientHeight + 2) return;
      el.classList.add("is-scrolling");
      if (el._sbTimer) clearTimeout(el._sbTimer);
      el._sbTimer = setTimeout(() => {
        el._sbTimer = null;
        el.classList.remove("is-scrolling");
      }, 850);
    }, { passive: true });
  }
  bindAutoHideScrollbar($("notes-input"));

  function maxTopNotesInputHeightPx() {
    const panel = $("notes-panel");
    const card = $("notes-card");
    const input = $("notes-input");
    const vp = $("notes-viewport");
    if (!panel || !card || !input || !vp) return 220;
    const cards = Array.from(vp.querySelectorAll(".note-block"));
    if (cards.length === 0) return Math.max(46, panel.clientHeight - 56);
    const topVisible = cards.find((c) => c.offsetTop + c.offsetHeight > vp.scrollTop + 4) || cards[0];
    const panelH = panel.clientHeight;
    const chromeH = Math.max(46, card.offsetHeight - input.offsetHeight);
    const keepCardH = topVisible.offsetHeight + 4;
    return Math.max(46, panelH - chromeH - 10 - keepCardH);
  }

  function measureTopNotesInputHeight(expanded) {
    const input = $("notes-input");
    const prevScroll = input.scrollTop;
    const prevOverflow = input.style.overflowY;
    const prevHeight = input.style.height;
    input.classList.remove("is-animating");
    input.style.overflowY = "hidden";
    input.style.height = "0px";
    const full = Math.max(46, input.scrollHeight);
    const cap = expanded ? maxTopNotesInputHeightPx() : NOTES_COLLAPSED_PX;
    const target = Math.max(46, Math.min(full, cap));
    if (!expanded) {
      state.notes.topCollapsedH = target;
    } else {
      state.notes.topCollapsedH = Math.max(46, Math.min(full, NOTES_COLLAPSED_PX));
    }
    input.style.height = prevHeight;
    input.style.overflowY = prevOverflow || "hidden";
    input.scrollTop = prevScroll;
    return { full, target };
  }

  function topNotesExtraCollapsedPx() {
    if (state.notes.cards.length === 0) return 0;
    const input = $("notes-input");
    const curH = input.offsetHeight || 46;
    const target = state.notes.topCollapsedH || 46;
    return Math.max(0, curH - target);
  }

  function maxNoteBlockEditorHeightPx(cardEl, editor) {
    const vp = $("notes-viewport");
    const baseVpH = vp ? vp.clientHeight : 0;
    const vpH = baseVpH + (state.notes.topExpanded ? 0 : topNotesExtraCollapsedPx());
    if (!vpH) return maxExpandedHeightPx();
    const chrome = Math.max(38, cardEl.offsetHeight - editor.offsetHeight);
    const nextCard = cardEl.nextElementSibling;
    if (nextCard && nextCard.classList.contains("note-block")) {
      return Math.max(NOTES_COLLAPSED_PX, vpH - chrome - 10 - nextCard.offsetHeight - 4);
    }
    return Math.max(NOTES_COLLAPSED_PX, vpH - chrome - 4);
  }

  function applyAutoGrowHeight(el, minH, maxH) {
    const prevScroll = el.scrollTop;
    const prevClientH = el.clientHeight;
    const prevScrollH = el.scrollHeight;
    const wasNearBottom = prevScrollH > prevClientH + 2 && (prevScroll + prevClientH >= prevScrollH - 8);

    if (el._animTimer) {
      clearTimeout(el._animTimer);
      el._animTimer = null;
    }
    el.classList.remove("is-animating");
    el.style.overflowY = "hidden";
    el.style.height = "0px";
    const full = Math.max(minH, el.scrollHeight);
    const cap = Math.max(minH, maxH);
    const target = Math.min(full, cap);
    el.style.height = target + "px";

    if (full > target) {
      el.style.overflowY = "auto";
      el.scrollTop = wasNearBottom ? el.scrollHeight : prevScroll;
    } else {
      el.style.overflowY = "hidden";
      el.scrollTop = 0;
    }
    return { full, target };
  }

  function animateNoteEditorHeight(editor, startH, targetH, overflowAfter) {
    if (editor._animTimer) {
      clearTimeout(editor._animTimer);
      editor._animTimer = null;
    }
    editor.classList.remove("is-animating");
    editor.style.overflowY = "hidden";
    editor.style.height = startH + "px";
    void editor.offsetHeight;
    editor.classList.add("is-animating");
    editor.style.height = targetH + "px";
    editor._animTimer = setTimeout(() => {
      editor._animTimer = null;
      editor.classList.remove("is-animating");
      editor.style.overflowY = overflowAfter;

  function expandTopNotesCard(animate) {
    if (state.notes.cards.length === 0) return;
    if (state.notes.topExpanded) return;
    state.notes.topExpanded = true;
    const input = $("notes-input");
    const startH = input.offsetHeight || 46;
    const { full, target } = measureTopNotesInputHeight(true);
    if (animate && Math.abs(target - startH) > 1) {
      animateNoteEditorHeight(input, startH, target, full > target ? "auto" : "hidden");
      setTimeout(() => syncDots($("notes-viewport"), $("notes-dots")), 305);
    } else {
      applyAutoGrowHeight(input, 46, maxTopNotesInputHeightPx());

  function collapseTopNotesCard(animate = true) {
    if (!state.notes.topExpanded) return;
    state.notes.topExpanded = false;
    const input = $("notes-input");
    if (document.activeElement === input) {
      input.blur();
    }
    if (state.notes.cards.length === 0) return;
    const startH = input.offsetHeight || 46;
    const { target } = measureTopNotesInputHeight(false);
    input.scrollTop = 0;
    if (animate && Math.abs(target - startH) > 1) {
      animateNoteEditorHeight(input, startH, target, "hidden");
      setTimeout(() => syncDots($("notes-viewport"), $("notes-dots")), 305);

      applyAutoGrowHeight(input, 46, NOTES_COLLAPSED_PX);

  function syncTopNotesLayout() {
    const hasCards = state.notes.cards.length > 0;
    $("notes-card").classList.toggle("has-cards", hasCards);
    $("notes-stage").classList.toggle("open", hasCards);
    const input = $("notes-input");
    if (!hasCards) {
      state.notes.topExpanded = false;
      state.notes.topCollapsedH = 46;
      if (input._animTimer) {
        clearTimeout(input._animTimer);
        input._animTimer = null;

      input.style.height = "";
      input.style.overflowY = "auto";
    } else {
      const cap = state.notes.topExpanded ? maxTopNotesInputHeightPx() : NOTES_COLLAPSED_PX;
      const { full } = applyAutoGrowHeight(input, 46, cap);
      state.notes.topCollapsedH = Math.max(46, Math.min(full, NOTES_COLLAPSED_PX));
    }
    requestAnimationFrame(() => syncDots($("notes-viewport"), $("notes-dots")));
  }

  function scheduleNoteSave() {
    const key = convKey(currentConv());
    state.notes.conv = key;
    state.notes.dirty = true;
    state.notes.seq += 1;
    setNoteDot(true, "");
    syncNotesActions();
    if (state.notes.timer) clearTimeout(state.notes.timer);
    state.notes.timer = setTimeout(() => {
      state.notes.timer = null;
      flushNoteSave();
    }, 1500);
  }

  async function saveNotesFor(key, payload, seq, keepalive) {
    const convPayload = key === DRAFT_KEY ? "" : key;
    try {
      const res = await apiFetch("/api/notes", {
        method: "POST",
        keepalive: Boolean(keepalive),
        body: JSON.stringify({
          conversationId: convPayload,
          draft: payload.draft,
          cards: payload.cards,
          next_id: payload.nextId,
        }),
      });
      if (!res.ok) {
        let serverMsg = "";
        try {
          const errJson = await res.json();
          if (errJson && errJson.error) serverMsg = String(errJson.error);
        } catch (_) {
        }
        const err = new Error(serverMsg || ("HTTP " + res.status));
        err.serverMsg = serverMsg;
        throw err;
      }
      if (state.notes.conv === key) {
        state.notes.savedSeq = Math.max(state.notes.savedSeq, seq);
        if (state.notes.seq === seq && !state.notes.dirty) {
          setNoteDot(false, "");
        }
      }
    } catch (err) {
      if (state.notes.conv === key && state.notes.seq === seq) {
        state.notes.dirty = true;
        setNoteDot(true, err && err.serverMsg ? err.serverMsg : "");
      }
    }
  }

  function currentNotesSnapshot() {
    return {
      draft: $("notes-input").value,
      cards: state.notes.cards.map((c) => ({ id: c.id, text: c.text, pinned: Boolean(c.pinned) })),
      nextId: state.notes.nextId,
    };
  }

  function flushNoteSave(opts) {
    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }
    const key = state.notes.conv;
    if (!state.notes.dirty || !key) return;
    state.notes.dirty = false;
    const seq = state.notes.seq;
    saveNotesFor(key, currentNotesSnapshot(), seq, opts && opts.keepalive);
  }

  function measureNoteEditorHeight(cardEl, editor, expanded) {
    const prevScroll = editor.scrollTop;
    const prevOverflow = editor.style.overflowY;
    editor.classList.remove("is-animating");
    editor.style.overflowY = "hidden";
    editor.style.height = "0px";
    const full = Math.max(22, editor.scrollHeight);
    const cap = expanded ? maxNoteBlockEditorHeightPx(cardEl, editor) : NOTES_COLLAPSED_PX;
    const target = Math.min(full, cap);
    editor.style.overflowY = prevOverflow || "hidden";
    editor.scrollTop = prevScroll;
    return { full, target };
  }

  function keepNextCardVisible(cardEl, smooth) {
    const vp = $("notes-viewport");
    if (!vp || !cardEl) return;
    if (cardEl.offsetTop < vp.scrollTop) {
      if (smooth) {
        vp.scrollTo({ top: cardEl.offsetTop, behavior: "smooth" });
      } else {
        vp.scrollTop = cardEl.offsetTop;
      }
      return;
    }
    const nextCard = cardEl.nextElementSibling;
    if (nextCard && nextCard.classList.contains("note-block")) {
      const needTop = (nextCard.offsetTop + nextCard.offsetHeight + 4) - vp.clientHeight;
      if (needTop > vp.scrollTop) {
        const dest = Math.min(cardEl.offsetTop, Math.max(0, needTop));
        if (smooth) {
          vp.scrollTo({ top: dest, behavior: "smooth" });
        } else {
          vp.scrollTop = dest;
        }
      }
    } else if (smooth) {
      cardEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  function collapseNoteCard(cardEl) {
    if (!cardEl || !cardEl.classList.contains("expanded")) return;
    const editor = cardEl.querySelector(".block-editor");
    if (document.activeElement === editor) {
      editor.blur();
    }
    flushNoteSave();
    const startH = editor.offsetHeight || NOTES_COLLAPSED_PX;
    const { full, target } = measureNoteEditorHeight(cardEl, editor, false);
    cardEl.classList.remove("expanded");
    editor.classList.toggle("is-clipped", full > target + 2);
    editor.readOnly = true;
    editor.scrollTop = 0;
    animateNoteEditorHeight(editor, startH, target, "hidden");
    if (state.notes.expandedCardId === Number(cardEl.dataset.cardId)) {
      state.notes.expandedCardId = null;
    }
    setTimeout(() => syncDots($("notes-viewport"), $("notes-dots")), 305);
  }

  function collapseAllNoteCards(exceptId) {
    $("notes-viewport").querySelectorAll(".note-block.expanded").forEach((el) => {
      if (exceptId !== undefined && Number(el.dataset.cardId) === exceptId) return;
      collapseNoteCard(el);
    });
  }

  function expandNoteCard(cardEl, focusEditor) {
    const id = Number(cardEl.dataset.cardId);
    collapseAllNoteCards(id);
    const editor = cardEl.querySelector(".block-editor");
    const startH = editor.offsetHeight || NOTES_COLLAPSED_PX;
    const { full, target } = measureNoteEditorHeight(cardEl, editor, true);
    cardEl.classList.add("expanded");
    editor.classList.remove("is-clipped");
    state.notes.expandedCardId = id;
    editor.readOnly = false;
    animateNoteEditorHeight(editor, startH, target, full > target ? "auto" : "hidden");
    if (focusEditor) {
      try {
        editor.focus({ preventScroll: true });
      } catch (_) {
        editor.focus();
      }
    }
    setTimeout(() => {
      keepNextCardVisible(cardEl, true);
      syncDots($("notes-viewport"), $("notes-dots"));
    }, 305);
  }

  function sortNoteCards() {
    const pinned = [];
    const rest = [];
    for (const c of state.notes.cards) {
      if (c.pinned) pinned.push(c);
      else rest.push(c);
    }
    state.notes.cards = pinned.concat(rest);
  }

  function buildNoteBlockElement(card) {
    const el = document.createElement("div");
    el.className = "note-block" + (card.pinned ? " pinned" : "");
    el.dataset.cardId = String(card.id);

    const head = document.createElement("div");
    head.className = "block-head";

    const leftGroup = document.createElement("div");
    leftGroup.className = "notes-actions-group";

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "notes-action";
    setTip(copyBtn, "Copy card");
    copyBtn.setAttribute("aria-label", "Copy card");
    copyBtn.innerHTML = ICON_COPY;
    copyBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const editor = el.querySelector(".block-editor");
      const ok = await copyPlainText(card.text, el.classList.contains("expanded") ? editor : null);
      if (ok) flashCheckButton(copyBtn);
    });

    const pinBtn = document.createElement("button");
    pinBtn.type = "button";
    pinBtn.className = "notes-action pin-btn" + (card.pinned ? " is-pinned" : "");
    const pinLabel = card.pinned ? "Unpin card" : "Pin to top";
    setTip(pinBtn, pinLabel);
    pinBtn.setAttribute("aria-label", pinLabel);
    pinBtn.setAttribute("aria-pressed", card.pinned ? "true" : "false");
    pinBtn.innerHTML = ICON_PIN;
    pinBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      togglePinNoteCard(card.id);
    });

    leftGroup.appendChild(copyBtn);
    leftGroup.appendChild(pinBtn);

    const delWrap = document.createElement("div");
    delWrap.className = "del-confirm-wrap";

    const trashBtn = document.createElement("button");
    trashBtn.type = "button";
    trashBtn.className = "notes-action del-trash-btn";
    setTip(trashBtn, "Delete card");
    trashBtn.setAttribute("aria-label", "Delete card");
    trashBtn.innerHTML = ICON_TRASH;

    const confirmBtns = document.createElement("div");
    confirmBtns.className = "del-confirm-btns";

    const okBtn = document.createElement("button");
    okBtn.type = "button";
    okBtn.className = "notes-action confirm-ok";
    setTip(okBtn, "Confirm delete");
    okBtn.setAttribute("aria-label", "Confirm delete");
    okBtn.innerHTML = ICON_CHECK;

    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "notes-action confirm-cancel";
    setTip(cancelBtn, "Cancel");
    cancelBtn.setAttribute("aria-label", "Cancel");
    cancelBtn.innerHTML = ICON_X;

    trashBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      cancelAllDeleteConfirms(delWrap);
      delWrap.classList.add("confirming");
      el.classList.add("is-confirming");
    });

    cancelBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      delWrap.classList.remove("confirming");
      el.classList.remove("is-confirming");
    });

    okBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteNoteCard(card.id);
    });

    confirmBtns.appendChild(okBtn);
    confirmBtns.appendChild(cancelBtn);
    delWrap.appendChild(trashBtn);
    delWrap.appendChild(confirmBtns);

    head.appendChild(leftGroup);
    head.appendChild(delWrap);

    const editor = document.createElement("textarea");
    editor.className = "block-editor";
    editor.spellcheck = false;
    editor.readOnly = true;
    editor.value = card.text;

    attachCtxMenu(editor);
    bindAutoHideScrollbar(editor);

    editor.addEventListener("input", () => {
      card.text = editor.value;
      const expanded = el.classList.contains("expanded");
      const maxH = expanded ? maxNoteBlockEditorHeightPx(el, editor) : NOTES_COLLAPSED_PX;
      const { full, target } = applyAutoGrowHeight(editor, 22, maxH);
      editor.classList.toggle("is-clipped", !expanded && full > target + 2);
      if (expanded) {
        keepNextCardVisible(el, false);
      }
      syncDots($("notes-viewport"), $("notes-dots"));
      scheduleNoteSave();
    });
    editor.addEventListener("blur", () => flushNoteSave());

    el.addEventListener("click", (e) => {
      if (e.target.closest(".notes-action, .del-confirm-wrap")) return;
      if (!el.classList.contains("expanded")) {
        expandNoteCard(el, true);
      }
    });

    el.appendChild(head);
    el.appendChild(editor);
    return el;
  }

  function renderNoteCards() {
    const vp = $("notes-viewport");
    vp.innerHTML = "";
    state.notes.expandedCardId = null;
    syncTopNotesLayout();
    for (const card of state.notes.cards) {
      const el = buildNoteBlockElement(card);
      vp.appendChild(el);
      const editor = el.querySelector(".block-editor");
      const { full, target } = applyAutoGrowHeight(editor, 22, NOTES_COLLAPSED_PX);
      editor.classList.toggle("is-clipped", full > target + 2);
    }
    requestAnimationFrame(() => syncDots(vp, $("notes-dots")));
  }

  function animateNoteCardsReorder(vp, targetEl, shouldScrollToTarget, onBeforePlay) {
    const blocks = Array.from(vp.querySelectorAll(".note-block"));
    const firstTops = new Map();
    for (const el of blocks) {
      firstTops.set(el, el.getBoundingClientRect().top);
    }

    for (const el of blocks) {
      if (el._flipTimer) {
        clearTimeout(el._flipTimer);
        el._flipTimer = null;
      }
      el.style.transition = "none";
      el.style.transform = "";
      el.style.zIndex = "";
      el.style.position = "";
    }

    const elById = new Map();
    for (const el of blocks) {
      elById.set(Number(el.dataset.cardId), el);
    }

    if (targetEl) {
      const newIdx = state.notes.cards.findIndex((c) => c.id === Number(targetEl.dataset.cardId));
      if (newIdx >= 0) {
        let refEl = null;
        for (let j = newIdx + 1; j < state.notes.cards.length; j++) {
          const cand = elById.get(state.notes.cards[j].id);
          if (cand && cand !== targetEl) {
            refEl = cand;
            break;
          }
        }
        vp.insertBefore(targetEl, refEl);
      }
    }

    for (let i = 0; i < state.notes.cards.length; i++) {
      const wantEl = elById.get(state.notes.cards[i].id);
      if (!wantEl) continue;
      const curAtI = vp.children[i];
      if (curAtI !== wantEl) {
        vp.insertBefore(wantEl, curAtI || null);
      }
    }

    if (shouldScrollToTarget && targetEl) {
      const targetScrollTop = Math.max(
        0,
        vp.scrollTop + (targetEl.getBoundingClientRect().top - vp.getBoundingClientRect().top)
      );
      if (vp.scrollTop > targetScrollTop) {
        vp.scrollTop = targetScrollTop;
      }
    }

    const vpRect = vp.getBoundingClientRect();
    const visTop = vpRect.top - 120;
    const visBot = vpRect.bottom + 120;
    const moving = [];

    for (const el of blocks) {
      const prevTop = firstTops.get(el);
      if (prevTop === undefined) {
        el.style.transition = "";
        continue;
      }
      const nextRect = el.getBoundingClientRect();
      const dy = prevTop - nextRect.top;
      const inView =
        (prevTop + nextRect.height >= visTop && prevTop <= visBot) ||
        (nextRect.bottom >= visTop && nextRect.top <= visBot);
      if (inView && Math.abs(dy) > 0.5) {
        el.style.transform = "translateY(" + dy.toFixed(2) + "px)";
        if (el === targetEl) {
          el.style.position = "relative";
          el.style.zIndex = "2";
        }
        moving.push(el);
      } else {
        el.style.transition = "";
      }
    }

    void vp.offsetHeight;

    for (const el of moving) {
      el.style.transition = "transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.28s ease, background-color 0.22s ease";
      el.style.transform = "";
      el._flipTimer = setTimeout(() => {
        el._flipTimer = null;
        el.style.transition = "";
        el.style.zIndex = "";
        el.style.position = "";
      }, 360);
    }

    if (onBeforePlay) {
      onBeforePlay();
    }

    setTimeout(() => syncDots(vp, $("notes-dots")), 365);
  }

  function togglePinNoteCard(cardId) {
    const oldIdx = state.notes.cards.findIndex((c) => c.id === cardId);
    if (oldIdx < 0) return;
    const card = state.notes.cards[oldIdx];
    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }
    card.pinned = !card.pinned;
    sortNoteCards();
    const newIdx = state.notes.cards.findIndex((c) => c.id === cardId);

    const vp = $("notes-viewport");
    const targetEl = vp.querySelector('.note-block[data-card-id="' + cardId + '"]');
    if (!targetEl) {
      renderNoteCards();
      if (card.pinned) {
        vp.scrollTop = 0;
      }
    } else {
      const pinBtn = targetEl.querySelector(".pin-btn");
      const pinLabel = card.pinned ? "Unpin card" : "Pin to top";
      const applyPinVisuals = () => {
        targetEl.classList.toggle("pinned", card.pinned);
        if (pinBtn) {
          pinBtn.classList.toggle("is-pinned", card.pinned);
          setTip(pinBtn, pinLabel);
          pinBtn.setAttribute("aria-label", pinLabel);
          pinBtn.setAttribute("aria-pressed", card.pinned ? "true" : "false");
        }
      };

      if (oldIdx === newIdx) {
        applyPinVisuals();
      } else {
        animateNoteCardsReorder(vp, targetEl, card.pinned, applyPinVisuals);
      }
    }

    const key = convKey(currentConv());
    state.notes.conv = key;
    state.notes.seq += 1;
    state.notes.dirty = false;
    setNoteDot(false, "");
    syncNotesActions();
    saveNotesFor(key, currentNotesSnapshot(), state.notes.seq, false);
  }

  function deleteNoteCard(cardId) {
    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }
    state.notes.cards = state.notes.cards.filter((c) => c.id !== cardId);
    if (state.notes.expandedCardId === cardId) {
      state.notes.expandedCardId = null;
    }
    renderNoteCards();
    const key = convKey(currentConv());
    state.notes.conv = key;
    state.notes.seq += 1;
    state.notes.dirty = false;
    setNoteDot(false, "");
    syncNotesActions();
    saveNotesFor(key, currentNotesSnapshot(), state.notes.seq, false);
  }

  async function syncNotesConv(conv) {
    const key = convKey(conv);
    if (state.notes.conv === key) return;

    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }
    const hadDirtyPrev = Boolean(state.notes.dirty && state.notes.conv);
    const prevKey = state.notes.conv;
    const prevSnap = hadDirtyPrev ? currentNotesSnapshot() : null;
    const prevSeq = state.notes.seq;

    cancelAllDeleteConfirms();
    state.notes.conv = key;
    state.notes.draft = "";
    state.notes.cards = [];
    state.notes.nextId = 1;
    state.notes.dirty = false;
    state.notes.seq = 0;
    state.notes.savedSeq = 0;
    state.notes.topExpanded = false;
    state.notes.topCollapsedH = 46;
    setNoteDot(false, "");

    $("notes-input").value = "";
    renderNoteCards();
    syncNotesActions();
    state.notes.loadingConv = key;

    if (hadDirtyPrev && prevKey && prevSnap) {
      await saveNotesFor(prevKey, prevSnap, prevSeq, false);
    }

    try {
      const q = new URLSearchParams({ conversationId: key });
      const res = await apiFetch("/api/notes?" + q.toString(), { method: "GET" });
      if (!res.ok) return;
      const data = await res.json();
      if (state.notes.conv === key && !state.notes.dirty && state.notes.seq === 0) {
        state.notes.draft = data.draft || "";
        state.notes.cards = Array.isArray(data.cards)
          ? data.cards.map((c) => ({
            id: Number(c.id) || 1,
            text: String(c.text || ""),
            pinned: Boolean(c.pinned),
          }))
          : [];
        sortNoteCards();
        state.notes.nextId = Number(data.next_id) || (state.notes.cards.length + 1);
        $("notes-input").value = state.notes.draft;
        renderNoteCards();
        syncNotesActions();
      }
    } catch (_) {
    } finally {
      if (state.notes.loadingConv === key) {
        state.notes.loadingConv = "";
      }
    }
  }

  function syncNotesActions() {
    const val = $("notes-input").value;
    const hasText = Boolean(val);
    const hasAddable = Boolean(val && val.trim());
    const atCardLimit = state.notes.cards.length >= MAX_NOTE_CARDS;
    const copyBtn = $("notes-copy-btn");
    const addBtn = $("notes-add-btn");
    const clearBtn = $("notes-clear-btn");
    copyBtn.disabled = !hasText && !copyBtn.classList.contains("is-checked");
    addBtn.disabled = !hasAddable || atCardLimit;
    setTip(
      addBtn,
      atCardLimit
        ? "Maximum " + MAX_NOTE_CARDS + " cards per chat reached"
        : "Save as card below (Ctrl+Enter)"
    );
    clearBtn.disabled = !hasText && !clearBtn.classList.contains("is-checked");
    if (!hasText) {
      $("notes-clear-wrap").classList.remove("confirming");
    }
  }

  $("notes-copy-btn").addEventListener("click", async () => {
    const input = $("notes-input");
    if (!input.value) return;
    if (await copyPlainText(input.value, input)) {
      flashCheckButton($("notes-copy-btn"));
    }
  });

  $("notes-add-btn").addEventListener("click", () => {
    const input = $("notes-input");
    const text = input.value;
    if (!text || !text.trim() || state.notes.cards.length >= MAX_NOTE_CARDS) return;

    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }

    const newCard = {
      id: state.notes.nextId++,
      text,
      pinned: false,
    };
    state.notes.cards.unshift(newCard);
    sortNoteCards();
    input.value = "";
    state.notes.draft = "";
    state.notes.topExpanded = false;

    const key = convKey(currentConv());
    state.notes.conv = key;
    state.notes.seq += 1;
    state.notes.dirty = false;
    setNoteDot(false, "");

    renderNoteCards();
    $("notes-viewport").scrollTop = 0;
    syncNotesActions();
    saveNotesFor(key, currentNotesSnapshot(), state.notes.seq, false);
  });

  $("notes-clear-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!$("notes-input").value) return;
    const wrap = $("notes-clear-wrap");
    cancelAllDeleteConfirms(wrap);
    wrap.classList.add("confirming");
  });

  $("notes-clear-cancel").addEventListener("click", (e) => {
    e.stopPropagation();
    $("notes-clear-wrap").classList.remove("confirming");
  });

  $("notes-clear-ok").addEventListener("click", (e) => {
    e.stopPropagation();
    const wrap = $("notes-clear-wrap");
    wrap.classList.remove("confirming");
    const input = $("notes-input");
    if (!input.value) return;
    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }
    input.focus();
    const ok = document.execCommand &&
      document.execCommand("selectAll") &&
      document.execCommand("delete");
    if (!ok) {
      input.value = "";
    }
    state.notes.draft = "";
    const key = convKey(currentConv());
    state.notes.conv = key;
    state.notes.seq += 1;
    state.notes.dirty = false;
    setNoteDot(false, "");
    syncTopNotesLayout();
    syncNotesActions();
    flashCheckButton($("notes-clear-btn"));
    saveNotesFor(key, currentNotesSnapshot(), state.notes.seq, false);
  });

  $("notes-copy-btn").addEventListener("mousedown", (e) => e.preventDefault());
  $("notes-clear-btn").addEventListener("mousedown", (e) => e.preventDefault());
  $("notes-clear-cancel").addEventListener("mousedown", (e) => e.preventDefault());
  $("notes-clear-ok").addEventListener("mousedown", (e) => e.preventDefault());

  $("notes-input").addEventListener("focus", () => {
    if (state.notes.cards.length > 0) {
      expandTopNotesCard(true);
    }
  });
  $("notes-input").addEventListener("input", () => {
    state.notes.draft = $("notes-input").value;
    if (state.notes.cards.length > 0) {
      state.notes.topExpanded = true;
    }
    syncTopNotesLayout();
    scheduleNoteSave();
  });
  $("notes-input").addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      if (!$("notes-add-btn").disabled) {
        $("notes-add-btn").click();
      }
    }
  });
  $("notes-input").addEventListener("blur", (e) => {
    flushNoteSave();
    if (e.relatedTarget && $("notes-card").contains(e.relatedTarget) && !e.relatedTarget.closest(".mode-tab")) {
      return;
    }
    collapseTopNotesCard(true);
  });

  function recalcVisibleCardsHeights() {
    if (state.notes.mode === "notes") {
      const panel = $("notes-panel");
      if (!panel || panel.clientWidth === 0) return;
      if (state.notes.cards.length > 0) {
        syncTopNotesLayout();
      }
      const vp = $("notes-viewport");
      vp.querySelectorAll(".note-block").forEach((cardEl) => {
        const ed = cardEl.querySelector(".block-editor");
        if (!ed) return;
        const expanded = cardEl.classList.contains("expanded");
        const maxH = expanded ? maxNoteBlockEditorHeightPx(cardEl, ed) : NOTES_COLLAPSED_PX;
        const { full, target } = applyAutoGrowHeight(ed, 22, maxH);
        ed.classList.toggle("is-clipped", !expanded && full > target + 2);
      });
      syncDots(vp, $("notes-dots"));
    } else if (state.notes.mode === "search") {
      const panel = $("search-panel");
      if (!panel || panel.clientWidth === 0) return;
      const vp = $("search-viewport");
      vp.querySelectorAll(".search-block").forEach((cardEl) => {
        const body = cardEl.querySelector(".search-body");
        if (!body) return;
        const expanded = cardEl.classList.contains("expanded");
        body.style.transition = "none";
        body.style.height = "auto";
        const fullH = Math.max(20, body.scrollHeight);
        const cap = expanded ? maxExpandedHeightPx() : SEARCH_COLLAPSED_PX;
        const targetH = Math.min(fullH, cap);
        body.style.overflowY = expanded && fullH > targetH ? "auto" : "hidden";
        body.style.height = targetH + "px";
        void body.offsetHeight;
        body.style.transition = "";
      });
      syncDots(vp, $("search-dots"));
    }
  }

  /* Workspace Mode Switching (Notes <-> Search) */
  function setWorkspaceMode(mode) {
    if (state.notes.mode === mode) return;
    const prevMode = state.notes.mode;
    cancelAllDeleteConfirms();
    if (mode === "search") {
      flushNoteSave();
      collapseTopNotesCard(false);
      collapseAllNoteCards();
    } else {
      collapseAllSearchBlocks();
    }
    state.notes.mode = mode;
    $("notes-panel").classList.toggle("open", mode === "notes");
    $("search-panel").classList.toggle("open", mode === "search");

    const targetPanel = $(mode === "search" ? "search-panel" : "notes-panel");
    const targetSwitch = targetPanel.querySelector(".mode-switch");
    if (targetSwitch) {
      targetSwitch.classList.add("no-anim");
      targetSwitch.classList.toggle("is-search", prevMode === "search");
      void targetSwitch.offsetWidth;
      targetSwitch.classList.remove("no-anim");
      targetSwitch.classList.toggle("is-search", mode === "search");
    }

    if (mode === "search") {
      $("search-input").focus();
      const conv = currentConv();
      if (state.search.query.trim() && (state.search.conv !== conv || state.search.lastScope !== state.search.scope)) {
        runChatSearch();
      } else {
        recalcVisibleCardsHeights();
      }
    } else {
      recalcVisibleCardsHeights();
    }
  }

  document.querySelectorAll(".mode-tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      setWorkspaceMode(tab.dataset.mode);
    });
  });

  /* Chat Context Search */
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function parseQueryTerms(rawQuery) {
    const trimmed = (rawQuery || "").trim();
    if (!trimmed) return [];
    if (
      trimmed.length >= 2 &&
      ((trimmed.startsWith('"') && trimmed.endsWith('"')) ||
        (trimmed.startsWith("«") && trimmed.endsWith("»")))
    ) {
      const inner = trimmed.slice(1, -1).trim().toLowerCase();
      return inner ? [inner] : [];
    }
    return trimmed
      .split(/\s+/)
      .map((w) => w.toLowerCase())
      .filter(Boolean);
  }

  function highlightHtml(text, query) {
    if (!text) return "";
    const terms = parseQueryTerms(query);
    if (terms.length === 0) return escapeHtml(text);
    const lowerText = text.toLowerCase();
    if (lowerText.length !== text.length) {
      return escapeHtml(text);
    }

    const ranges = [];
    for (const term of terms) {
      let pos = 0;
      while (pos < lowerText.length) {
        const idx = lowerText.indexOf(term, pos);
        if (idx < 0) break;
        ranges.push([idx, idx + term.length]);
        pos = idx + term.length;
      }
    }
    if (ranges.length === 0) return escapeHtml(text);

    ranges.sort((a, b) => (a[0] !== b[0] ? a[0] - b[0] : b[1] - a[1]));
    const merged = [ranges[0]];
    for (let i = 1; i < ranges.length; i++) {
      const prev = merged[merged.length - 1];
      const cur = ranges[i];
      if (cur[0] <= prev[1]) {
        if (cur[1] > prev[1]) prev[1] = cur[1];
      } else {
        merged.push(cur);
      }
    }

    let out = "";
    let cursor = 0;
    for (const [start, end] of merged) {
      if (start > cursor) {
        out += escapeHtml(text.slice(cursor, start));
      }
      out += "<mark>" + escapeHtml(text.slice(start, end)) + "</mark>";
      cursor = end;
    }
    if (cursor < text.length) {
      out += escapeHtml(text.slice(cursor));
    }
    return out;
  }

  function roleBadgeInfo(role) {
    if (role === "user") return { label: "You", cls: "role-user" };
    if (role === "summary") return { label: "Summary", cls: "role-summary" };
    return { label: "Agent", cls: "" };
  }

  function collapseSearchBlock(cardEl) {
    if (!cardEl || !cardEl.classList.contains("expanded")) return;
    const body = cardEl.querySelector(".search-body");
    const snippetHtml = cardEl._snippetHtml || "";
    const startH = body.offsetHeight;

    body.style.transition = "none";
    body.innerHTML = snippetHtml;
    body.style.height = "auto";
    const targetH = Math.min(Math.max(20, body.scrollHeight), SEARCH_COLLAPSED_PX);
    body.style.height = startH + "px";
    void body.offsetHeight;
    body.style.transition = "";

    cardEl.classList.remove("expanded");
    body.scrollTop = 0;
    body.style.overflowY = "hidden";
    body.style.height = targetH + "px";
    setTimeout(() => syncDots($("search-viewport"), $("search-dots")), 300);
  }

  function collapseAllSearchBlocks(exceptEl) {
    $("search-viewport").querySelectorAll(".search-block.expanded").forEach((el) => {
      if (exceptEl && el === exceptEl) return;
      collapseSearchBlock(el);
    });
  }

  function expandSearchBlock(cardEl) {
    collapseAllSearchBlocks(cardEl);
    const body = cardEl.querySelector(".search-body");
    const fullHtml = cardEl._fullHtml || "";
    const startH = body.offsetHeight;

    body.style.transition = "none";
    body.innerHTML = fullHtml;
    body.style.height = "auto";
    const fullH = Math.max(20, body.scrollHeight);
    const targetH = Math.min(fullH, maxExpandedHeightPx());
    body.style.height = startH + "px";
    void body.offsetHeight;
    body.style.transition = "";

    cardEl.classList.add("expanded");
    body.style.overflowY = fullH > targetH ? "auto" : "hidden";
    body.style.height = targetH + "px";

    setTimeout(() => {
      const firstMark = body.querySelector("mark");
      if (firstMark && fullH > targetH) {
        const markTop = firstMark.offsetTop - body.offsetTop;
        body.scrollTop = Math.max(0, markTop - Math.floor(targetH / 3));
      }
      cardEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
      syncDots($("search-viewport"), $("search-dots"));
    }, 60);
  }

  function renderSearchResults(query) {
    const vp = $("search-viewport");
    const countEl = $("search-count");
    const isAllScope = state.search.scope === "all";
    vp.innerHTML = "";

    if (!query.trim()) {
      countEl.textContent = "";
      vp.innerHTML = isAllScope
        ? '<div class="search-empty">Search prompts, replies, and summaries across all chats</div>'
        : '<div class="search-empty">Search prompts, replies, and compacted summaries</div>';
      syncDots(vp, $("search-dots"));
      return;
    }

    if (!currentConv() && !isAllScope) {
      countEl.textContent = "";
      vp.innerHTML = '<div class="search-empty">Start or open a conversation to search its history</div>';
      syncDots(vp, $("search-dots"));
      return;
    }

    const total = state.search.total || 0;
    const results = state.search.results || [];
    if (results.length === 0) {
      countEl.textContent = "0 found";
      vp.innerHTML = '<div class="search-empty">No matches found</div>';
      syncDots(vp, $("search-dots"));
      return;
    }

    countEl.textContent = total > results.length ? (results.length + "+ found") : (total + " found");

    for (const r of results) {
      const el = document.createElement("div");
      el.className = "search-block";
      el.dataset.stepIndex = String(r.step_index);

      const head = document.createElement("div");
      head.className = "block-head";

      const meta = document.createElement("div");
      meta.className = "block-meta";

      const badge = roleBadgeInfo(r.role);
      const roleSpan = document.createElement("span");
      roleSpan.className = "search-role" + (badge.cls ? " " + badge.cls : "");
      roleSpan.textContent = badge.label;
      meta.appendChild(roleSpan);

      if (r.archived) {
        const arch = document.createElement("span");
        arch.className = "search-archived";
        arch.textContent = "before compact";
        meta.appendChild(arch);
      }

      if (r.created_at) {
        const ts = document.createElement("span");
        ts.textContent = fmtDateTime(r.created_at);
        meta.appendChild(ts);
      }

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "notes-action";
      setTip(copyBtn, "Copy full message");
      copyBtn.setAttribute("aria-label", "Copy full message");
      copyBtn.innerHTML = ICON_COPY;
      copyBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (await copyPlainText(r.text)) {
          flashCheckButton(copyBtn);
        }
      });

      head.appendChild(copyBtn);
      head.appendChild(meta);

      const body = document.createElement("div");
      body.className = "search-body";
      const snippetHtml = highlightHtml(r.snippet || "", query);
      const fullHtml = highlightHtml(r.text || "", query);
      el._snippetHtml = snippetHtml;
      el._fullHtml = fullHtml;
      body.innerHTML = snippetHtml;
      attachCtxMenu(body);
      bindAutoHideScrollbar(body);

      el.addEventListener("click", (e) => {
        if (e.target.closest(".notes-action")) return;
        if (!el.classList.contains("expanded")) {
          expandSearchBlock(el);
        }
      });

      el.appendChild(head);
      if (isAllScope && r.chat_title) {
        const titleEl = document.createElement("div");
        titleEl.className = "search-chat-title" + (r.is_current ? " is-current" : "");
        const titleText = r.chat_title + (r.is_current ? " · current" : "");
        titleEl.textContent = titleText;
        titleEl.setAttribute("data-tip-overflow", "1");
        setTip(titleEl, titleText);
        el.appendChild(titleEl);
      }
      el.appendChild(body);
      vp.appendChild(el);

      const targetH = Math.min(Math.max(20, body.scrollHeight), SEARCH_COLLAPSED_PX);
      body.style.height = targetH + "px";
    }

    vp.scrollTop = 0;
    requestAnimationFrame(() => syncDots(vp, $("search-dots")));
  }

  async function runChatSearch() {
    const query = $("search-input").value;
    state.search.query = query;
    const conv = currentConv();
    const scope = state.search.scope === "all" ? "all" : "this";
    state.search.conv = conv;
    state.search.lastScope = scope;
    const mySeq = ++state.search.seq;

    if (state.search.aborter) {
      try { state.search.aborter.abort(); } catch (_) {}
      state.search.aborter = null;
    }

    $("search-clear-btn").disabled = !query;

    if (!query.trim() || (!conv && scope !== "all")) {
      state.search.results = [];
      state.search.total = 0;
      renderSearchResults(query);
      return;
    }

    const aborter = typeof AbortController === "function" ? new AbortController() : null;
    state.search.aborter = aborter;

    try {
      const q = new URLSearchParams({ conversationId: conv, q: query, scope });
      const opts = { method: "GET" };
      if (aborter) opts.signal = aborter.signal;
      const res = await apiFetch("/api/search?" + q.toString(), opts);
      if (!res.ok) return;
      const data = await res.json();
      if (mySeq !== state.search.seq) return;
      state.search.results = Array.isArray(data.results) ? data.results : [];
      state.search.total = Number(data.total) || state.search.results.length;
      renderSearchResults(query);
    } catch (_) {
    } finally {
      if (state.search.aborter === aborter) {
        state.search.aborter = null;
      }
    }
  }

  document.querySelectorAll(".scope-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const nextScope = btn.dataset.scope === "all" ? "all" : "this";
      if (state.search.scope === nextScope) return;
      state.search.scope = nextScope;
      document.querySelectorAll(".scope-btn").forEach((b) => {
        const active = b.dataset.scope === nextScope;
        b.classList.toggle("active", active);
        b.setAttribute("aria-pressed", active ? "true" : "false");
      });
      $("search-input").placeholder = nextScope === "all"
        ? "Search across all chats…"
        : "Search messages in this chat…";
      if (state.search.timer) {
        clearTimeout(state.search.timer);
        state.search.timer = null;
      }
      runChatSearch();
    });
  });

  $("search-input").addEventListener("input", () => {
    const val = $("search-input").value;
    $("search-clear-btn").disabled = !val;
    state.search.query = val;
    if (state.search.timer) clearTimeout(state.search.timer);
    const delay = state.search.scope === "all" ? 240 : 150;
    state.search.timer = setTimeout(() => {
      state.search.timer = null;
      runChatSearch();
    }, delay);
  });

  $("search-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      if (state.search.timer) {
        clearTimeout(state.search.timer);
        state.search.timer = null;
      }
      runChatSearch();
    }
  });

  $("search-clear-btn").addEventListener("click", () => {
    if (state.search.timer) {
      clearTimeout(state.search.timer);
      state.search.timer = null;
    }
    $("search-input").value = "";
    state.search.query = "";
    state.search.results = [];
    state.search.total = 0;
    $("search-clear-btn").disabled = true;
    renderSearchResults("");
    $("search-input").focus();
  });

  /* About-style Outside Click / Key Auto-Collapse for Expanded Blocks & Delete Confirms */
  function selectionInsideEl(el) {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return false;
    return el.contains(sel.getRangeAt(0).commonAncestorContainer);
  }

  document.addEventListener("pointerdown", (e) => {
    if (!e.target.closest(".del-confirm-wrap.confirming")) {
      cancelAllDeleteConfirms();
    }
    if (e.target.closest("#ctx-menu")) return;

    if (state.notes.topExpanded && !e.target.closest("#notes-card")) {
      collapseTopNotesCard(true);
    }
    const expNote = $("notes-viewport").querySelector(".note-block.expanded");
    if (expNote && !expNote.contains(e.target)) {
      collapseNoteCard(expNote);
    }
    const expSearch = $("search-viewport").querySelector(".search-block.expanded");
    if (expSearch && !expSearch.contains(e.target)) {
      collapseSearchBlock(expSearch);
    }
  }, true);

  document.addEventListener("keydown", (e) => {
    if (["Shift", "Control", "Alt", "Meta", "AltGraph"].includes(e.key)) return;

    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.code === "KeyF") {
      e.preventDefault();
      setWorkspaceMode("search");
      $("search-input").focus();
      $("search-input").select();
      return;
    }

    if (e.key === "Escape") {
      cancelAllDeleteConfirms();
      if (state.notes.topExpanded && !$("ctx-menu").classList.contains("open")) {
        collapseTopNotesCard(true);
        if (document.activeElement === $("notes-input")) {
          $("notes-input").blur();
        }
      }
    }

    const expNote = $("notes-viewport").querySelector(".note-block.expanded");
    if (expNote) {
      const editor = expNote.querySelector(".block-editor");
      const hasEditorSel = editor && (editor.selectionEnd || 0) > (editor.selectionStart || 0);
      if ((e.ctrlKey || e.metaKey) && e.code === "KeyC" && (hasEditorSel || selectionInsideEl(expNote))) {
        return;
      }
      if (!expNote.contains(e.target) || e.key === "Escape") {
        if (!$("ctx-menu").classList.contains("open")) {
          collapseNoteCard(expNote);
        }
      }
    }

    const expSearch = $("search-viewport").querySelector(".search-block.expanded");
    if (expSearch) {
      if ((e.ctrlKey || e.metaKey) && e.code === "KeyC" && selectionInsideEl(expSearch)) {
        return;
      }
      if (!expSearch.contains(e.target) || e.key === "Escape") {
        if (!$("ctx-menu").classList.contains("open")) {
          collapseSearchBlock(expSearch);
        }
      }
    }
  }, true);

  /* Custom Antigravity-style Context Menu */
  let ctxTarget = null;
  let ctxCapturedSel = "";

  function isFormTextTarget(el) {
    return el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement;
  }

  function getElementSelectedText(el) {
    if (!el) return "";
    if (isFormTextTarget(el)) {
      const start = el.selectionStart || 0;
      const end = el.selectionEnd || 0;
      return end > start ? el.value.slice(start, end) : "";
    }
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return "";
    const range = sel.getRangeAt(0);
    if (!el.contains(range.commonAncestorContainer) && !range.intersectsNode(el)) {
      return "";
    }
    return sel.toString();
  }

  function closeCtxMenu() {
    $("ctx-menu").classList.remove("open");
    ctxTarget = null;
    ctxCapturedSel = "";
  }

  function replaceTargetSelection(el, text) {
    el.focus();
    const ok = document.execCommand && document.execCommand("insertText", false, text);
    if (!ok) {
      const start = el.selectionStart || 0;
      const end = el.selectionEnd || 0;
      el.setRangeText(text, start, end, "end");
      el.dispatchEvent(new Event("input", { bubbles: true }));
    }
  }

  function openCtxMenu(target, x, y) {
    hideTip(true);
    ctxTarget = target;
    ctxCapturedSel = getElementSelectedText(target);
    const menu = $("ctx-menu");
    const isForm = isFormTextTarget(target);
    const hasSel = Boolean(ctxCapturedSel);
    const isReadonly = !isForm || Boolean(target.readOnly);
    const hasContent = isForm ? Boolean(target.value) : Boolean(target.textContent);
    menu.querySelector('[data-act="cut"]').disabled = !hasSel || isReadonly;
    menu.querySelector('[data-act="copy"]').disabled = !hasSel;
    menu.querySelector('[data-act="paste"]').disabled = isReadonly;
    menu.querySelector('[data-act="selectAll"]').disabled = !hasContent;

    menu.classList.add("open");
    const mw = menu.offsetWidth || 88;
    const mh = menu.offsetHeight || 124;
    const left = Math.max(6, Math.min(x, window.innerWidth - mw - 6));
    const top = Math.max(6, Math.min(y, window.innerHeight - mh - 6));
    menu.style.left = left + "px";
    menu.style.top = top + "px";
  }

  function attachCtxMenu(el) {
    if (!el || el._hasCtxMenu) return;
    el._hasCtxMenu = true;
    el.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      if (el.id === "notes-input") {
        if (state.notes.cards.length > 0 && !state.notes.topExpanded) {
          expandTopNotesCard(true);
        }
      } else if (el.classList.contains("block-editor")) {
        const card = el.closest(".note-block");
        if (card && !card.classList.contains("expanded")) {
          expandNoteCard(card, true);
        }
      } else if (el.classList.contains("search-body")) {
        const card = el.closest(".search-block");
        if (card && !card.classList.contains("expanded")) {
          expandSearchBlock(card);
        }
      }
      openCtxMenu(el, e.clientX, e.clientY);
    });
  }

  attachCtxMenu($("notes-input"));
  attachCtxMenu($("in-at"));
  attachCtxMenu($("search-input"));

  $("ctx-menu").addEventListener("mousedown", (e) => {
    e.preventDefault();
  });

  $("ctx-menu").addEventListener("click", async (e) => {
    const btn = e.target.closest(".ctx-item");
    if (!btn || btn.disabled || !ctxTarget) return;
    const target = ctxTarget;
    const captured = ctxCapturedSel;
    const act = btn.dataset.act;
    closeCtxMenu();

    if (!isFormTextTarget(target)) {
      const textToCopy = captured || getElementSelectedText(target);
      if (act === "copy" && textToCopy) {
        await copyPlainText(textToCopy);
      } else if (act === "selectAll") {
        const range = document.createRange();
        range.selectNodeContents(target);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      return;
    }

    target.focus();
    const start = target.selectionStart || 0;
    const end = target.selectionEnd || 0;
    const selected = target.value.slice(start, end);

    if (act === "cut" && selected) {
      try {
        await navigator.clipboard.writeText(selected);
      } catch (_) {
        document.execCommand("copy");
      }
      const deleted = document.execCommand && document.execCommand("delete");
      if (!deleted) {
        target.setRangeText("", start, end, "start");
        target.dispatchEvent(new Event("input", { bubbles: true }));
      }
    } else if (act === "copy" && selected) {
      try {
        await navigator.clipboard.writeText(selected);
      } catch (_) {
        document.execCommand("copy");
      }
    } else if (act === "paste") {
      try {
        const clip = await navigator.clipboard.readText();
        if (clip !== undefined && clip !== null) {
          replaceTargetSelection(target, clip);
        }
      } catch (_) {
        document.execCommand("paste");
      }
    } else if (act === "selectAll") {
      target.select();
    }
  });

  document.addEventListener("mousedown", (e) => {
    if (!e.target.closest("#ctx-menu")) {
      closeCtxMenu();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeCtxMenu();
  });

  function render(d) {
    const conv = currentConv();
    const key = convKey(conv);
    const isConvSwitch = state.settingsLoadedForConv !== key;
    const isNewConv = state.anim.conv !== key;
    if (isConvSwitch && state.settingsLoadedForConv !== null && hasPendingSettingsChange()) {
      const prevConv = state.settingsLoadedForConv === DRAFT_KEY ? "" : state.settingsLoadedForConv;
      saveAutoSettings(prevConv);
    }
    state.lastData = d;
    if (d.settings) {
      state.settings = d.settings;
      if (isConvSwitch) {
        state.settingsDirty = false;
      }
      if (isConvSwitch || (!state.settingsDirty && !state.settingsSaving && document.activeElement !== $("in-at"))) {
        $("in-auto").checked = Boolean(d.settings.auto_compact_enabled);
        $("in-at").value = Math.round((d.settings.auto_compact_threshold || 250000) / 1000);
        syncThresholdWidth();
        state.settingsLoadedForConv = key;
      }
    }

    syncNotesConv(conv);
    if (state.notes.mode === "search" && state.search.conv !== conv) {
      if (state.search.query.trim()) {
        runChatSearch();
      } else {
        state.search.conv = conv;
        renderSearchResults("");
      }
    }

    if (isConvSwitch) {
      clearUndoDone();
    }

    if (d.status !== "ok") {
      clearCompactPending();
      stopWorkingCompactBtn();
      syncBarFlow(false, false);
      animateMeterTo(key, 0, 0, false);
      updateAutoPin(isNewConv);
      $("first-ts").textContent = "—";
      $("last-ts").textContent = "—";
      $("msgs").textContent = "0";
      const cs = $("compact-state");
      cs.className = "compact-state";
      cs.textContent = "Not compacted";
      if (!state.undoDone) {
        $("undo-compact-btn").classList.remove("visible");
      }
      evaluateAutoCompact(d);
      setCompactBtnStatus();
      return;
    }

    if (d.compact_in_flight) {
      clearCompactPending();
      startWorkingCompactBtn();
    } else if (d.just_compressed) {
      clearCompactPending();
      if (state.compactingActive) {
        stopWorkingCompactBtn();
        setCompactBtnStatus("Done!", "is-ok", 2000, "", true);
      }
    } else if (!state.compactPending && state.compactingActive && !d.is_busy) {
      stopWorkingCompactBtn();
      setCompactBtnStatus();
    }

    const tokens = d.context_tokens || 0;
    const deltaTokens = d.delta_tokens || 0;
    const hasDelta = Boolean(d.has_delta);

    syncBarFlow(d.is_busy, d.compact_in_flight || state.compactingActive);

    animateMeterTo(key, tokens, deltaTokens, hasDelta);
    updateAutoPin(isNewConv);

    $("first-ts").textContent = fmtDateTime(d.first_message_at);
    $("last-ts").textContent = fmtDateTime(d.last_message_at);

    $("msgs").textContent = fmt(d.user_messages || 0);

    const cs = $("compact-state");
    const cpCount = d.checkpoint_count || 0;
    if (cpCount > 0) {
      cs.className = "compact-state yes";
      cs.textContent = cpCount > 1 ? "Compacted ×" + cpCount : "Compacted";
    } else {
      cs.className = "compact-state";
      cs.textContent = "Not compacted";
    }

    const canUndo =
      d.undo_step_index !== null &&
      d.undo_step_index !== undefined &&
      !d.is_busy &&
      !d.compact_in_flight;
    if (canUndo) {
      preloadNativeDoneSound();
    }
    if (state.undoDone) {
      $("undo-compact-btn").classList.add("visible", "is-done");
    } else if (!state.undoInFlight) {
      $("undo-compact-btn").classList.toggle("visible", canUndo);
    }

    evaluateAutoCompact(d);
    refreshCompactBtnDisabled();
  }

  async function poll() {
    if (state.timer) {
      clearTimeout(state.timer);
      state.timer = null;
    }
    const myGen = ++state.pollGen;
    const conv = currentConv();
    const aborter = typeof AbortController === "function" ? new AbortController() : null;
    const timeoutId = aborter ? setTimeout(() => {
      try { aborter.abort(); } catch (_) {}
    }, 8000) : null;
    try {
      const q = new URLSearchParams();
      if (conv) q.set("conversationId", conv);
      if (state.etag) q.set("etag", state.etag);
      const opts = { method: "GET" };
      if (aborter) opts.signal = aborter.signal;
      const res = await apiFetch("/api/context?" + q.toString(), opts);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (myGen !== state.pollGen) return;
      if (state.hadNetError) {
        state.hadNetError = false;
        $("total").style.opacity = "1";
      }
      if (!data.unchanged) {
        state.etag = data.etag || "";
        render(data);
      }
    } catch (err) {
      if (myGen !== state.pollGen) return;
      state.hadNetError = true;
      $("total").style.opacity = "0.55";
      syncBarFlow(false, false);
    } finally {
      if (timeoutId) clearTimeout(timeoutId);
      if (myGen === state.pollGen) {
        const delay = document.hidden ? 4000 : (state.lastData && state.lastData.is_busy ? 600 : 1200);
        state.timer = setTimeout(poll, delay);
      }
    }
  }

  window.addEventListener("blur", () => {
    hideTip(true);
    closeCtxMenu();
    cancelAllDeleteConfirms();
    collapseTopNotesCard(true);
    collapseAllNoteCards();
    collapseAllSearchBlocks();
    if (Date.now() >= state.keepAboutUntil) {
      setAboutOpen(false);
    }
    commitSettingsIfNeeded();
    flushNoteSave();
  });
  window.addEventListener("pagehide", () => {
    commitSettingsIfNeeded();
    flushNoteSave({ keepalive: true });
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      hideTip(true);
      closeCtxMenu();
      cancelAllDeleteConfirms();
      collapseTopNotesCard(true);
      collapseAllNoteCards();
      collapseAllSearchBlocks();
      if (Date.now() >= state.keepAboutUntil) {
        setAboutOpen(false);
      }
      commitSettingsIfNeeded();
      flushNoteSave({ keepalive: true });
    } else if (state.timer) {
      clearTimeout(state.timer);
      poll();
    }
  });

  if (typeof ResizeObserver === "function") {
    let lastW = 0;
    let lastH = 0;
    const wsEl = document.querySelector(".workspace-area");
    if (wsEl) {
      const wsRo = new ResizeObserver(() => {
        const w = wsEl.clientWidth;
        const h = wsEl.clientHeight;
        if (!w || !h || (w === lastW && h === lastH)) return;
        lastW = w;
        lastH = h;
        recalcVisibleCardsHeights();
      });
      wsRo.observe(wsEl);
    }
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => recalcVisibleCardsHeights()).catch(() => {});
  }

  syncThresholdWidth();
  syncNotesConv(currentConv());
  poll();
})();
</script>
</body>
</html>
