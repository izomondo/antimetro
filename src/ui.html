    }
  }

  function collapseAllNoteCards(exceptId) {
    $("ws-viewport").querySelectorAll(".note-block.expanded").forEach((el) => {
      if (exceptId !== undefined && Number(el.dataset.cardId) === exceptId) return;
      collapseNoteCard(el);
    });
  }

  function expandNoteCard(cardEl, focusEditor) {
    const id = Number(cardEl.dataset.cardId);
    const wasExpanded = cardEl.classList.contains("expanded");
    collapseAllNoteCards(id);
    const editor = cardEl.querySelector(".block-editor");
    const isSolo = cardEl.classList.contains("is-solo");
    const savedScroll = wasExpanded ? editor.scrollTop : 0;
    cardEl.classList.add("expanded");
    editor.classList.remove("is-clipped");
    state.notes.expandedCardId = id;
    editor.readOnly = false;
    if (!isSolo) {
      const startH = editor.offsetHeight || NOTES_COLLAPSED_PX;
      const { full, target } = measureNoteEditorHeight(cardEl, editor, true);
      animateNoteEditorHeight(editor, startH, target, full > target ? "auto" : "hidden");
      editor.scrollTop = savedScroll;
      setTimeout(() => {
        keepCardHeaderVisible(cardEl, true);
        syncScrollRail($("ws-viewport"), false);
      }, 305);
    }
    if (focusEditor) {
      try {
        editor.focus({ preventScroll: true });
      } catch (_) {
        editor.focus();
      }
      if (!wasExpanded) {
        editor.scrollTop = 0;
        requestAnimationFrame(() => {
          if (cardEl.classList.contains("expanded")) {
            editor.scrollTop = 0;
          }
        });
      }
    }
  }

  function sortNoteCards() {
    const pinned = [];
    const rest = [];
    for (const c of state.notes.cards) {
      if (c.pinned) pinned.push(c);
      else rest.push(c);
    }
    state.notes.cards = pinned.concat(rest);
  }

  function buildNoteBlockElement(card, solo) {
    const el = document.createElement("div");
    el.className = "note-block" + (card.pinned ? " pinned" : "") + (solo ? " expanded is-solo" : "") + (solo && !card.text ? " is-solo-empty" : "");
    el.dataset.cardId = String(card.id);

    const head = document.createElement("div");
    head.className = "block-head";
    head.addEventListener("mousedown", (e) => {
      if (e.target.closest("button")) {
        e.preventDefault();
      }
    });

    const leftGroup = document.createElement("div");
    leftGroup.className = "notes-actions-group";

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "notes-action copy-btn";
    copyBtn.tabIndex = -1;
    copyBtn.setAttribute("aria-label", "Copy card");
    copyBtn.innerHTML = ICON_COPY;
    copyBtn.disabled = !card.text;
    copyBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!card.text) return;
      const editor = el.querySelector(".block-editor");
      const ok = await copyPlainText(card.text, el.classList.contains("expanded") ? editor : null);
      if (ok) flashCheckButton(copyBtn);
    });

    const saveDot = document.createElement("span");
    saveDot.className = "note-dot";
    saveDot.setAttribute("aria-hidden", "true");

    const pinBtn = document.createElement("button");
    pinBtn.type = "button";
    pinBtn.className = "notes-action pin-btn" + (card.pinned ? " is-pinned" : "");
    const pinLabel = card.pinned ? "Unpin card" : "Pin to top";
    pinBtn.setAttribute("aria-label", pinLabel);
    pinBtn.setAttribute("aria-pressed", card.pinned ? "true" : "false");
    pinBtn.innerHTML = ICON_PIN;
    pinBtn.disabled = Boolean(solo && !card.text.trim());
    pinBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (card.id > 0) {
        togglePinNoteCard(card.id);
      }
    });

    leftGroup.appendChild(pinBtn);
    leftGroup.appendChild(copyBtn);
    leftGroup.appendChild(saveDot);

    const delWrap = document.createElement("div");
    delWrap.className = "del-confirm-wrap";

    const trashBtn = document.createElement("button");
    trashBtn.type = "button";
    trashBtn.className = "notes-action del-trash-btn";
    trashBtn.setAttribute("aria-label", "Delete card");
    trashBtn.innerHTML = ICON_TRASH;

    const confirmBtns = document.createElement("div");
    confirmBtns.className = "del-confirm-btns";

    const okBtn = document.createElement("button");
    okBtn.type = "button";
    okBtn.className = "notes-action confirm-ok";
    okBtn.setAttribute("aria-label", "Confirm delete");
    okBtn.innerHTML = ICON_CHECK;

    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "notes-action confirm-cancel";
    cancelBtn.setAttribute("aria-label", "Cancel");
    cancelBtn.innerHTML = ICON_X;

    trashBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      cancelAllDeleteConfirms(delWrap);
      delWrap.classList.add("confirming");
      el.classList.add("is-confirming");
    });

    cancelBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      delWrap.classList.remove("confirming");
      el.classList.remove("is-confirming");
    });

    okBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteNoteCard(card.id);
    });

    confirmBtns.appendChild(okBtn);
    confirmBtns.appendChild(cancelBtn);
    delWrap.appendChild(trashBtn);
    delWrap.appendChild(confirmBtns);

    head.appendChild(leftGroup);
    head.appendChild(delWrap);

    const editor = document.createElement("textarea");
    editor.className = "block-editor";
    editor.spellcheck = false;
    editor.readOnly = !solo;
    editor.placeholder = "Add notes for this chat…";
    editor.value = card.text;

    attachCtxMenu(editor);
    bindAutoHideScrollbar(editor);

    editor.addEventListener("input", () => {
      const val = editor.value;
      if (solo && card.id === 0) {
        if (val.length > 0) {
          card.id = state.notes.nextId++;
          card.text = val;
          el.dataset.cardId = String(card.id);
          state.notes.cards.push(card);
          state.notes.expandedCardId = card.id;
          el.classList.remove("is-solo-empty");
          copyBtn.disabled = false;
          copyBtn.tabIndex = el.classList.contains("is-editing") ? 0 : -1;
          pinBtn.disabled = !val.trim();
          syncNotesActions();
          scheduleNoteSave(card.id);
        }
      } else {
        card.text = val;
        copyBtn.disabled = !val;
        copyBtn.tabIndex = (!copyBtn.disabled && el.classList.contains("is-editing")) ? 0 : -1;
        if (el.classList.contains("is-solo")) {
          const isEmpty = !val;
          el.classList.toggle("is-solo-empty", isEmpty);
          pinBtn.disabled = !val.trim();
        } else {
          const expanded = el.classList.contains("expanded");
          const maxH = expanded ? maxNoteBlockEditorHeightPx(el, editor) : NOTES_COLLAPSED_PX;
          const { full, target } = applyAutoGrowHeight(editor, 22, maxH);
          editor.classList.toggle("is-clipped", !expanded && full > target + 2);
          if (expanded) {
            keepCardHeaderVisible(el, false);
          }
        }
        syncScrollRail($("ws-viewport"), false);
        if (card.id > 0) {
          scheduleNoteSave(card.id);
        }
      }
    });

    editor.addEventListener("focus", () => {
      el.classList.add("is-editing");
      copyBtn.tabIndex = copyBtn.disabled ? -1 : 0;
    });

    editor.addEventListener("blur", () => {
      if (el._reordering) return;
      el.classList.remove("is-editing");
      copyBtn.tabIndex = -1;
      if (el.classList.contains("is-solo") && !card.text.trim() && card.id > 0) {
        const hadSaved = state.notes.savedSeq > 0 || state.notes.dirty;
        state.notes.cards = state.notes.cards.filter((c) => c.id !== card.id);
        state.notes.dirtyCardIds.delete(card.id);
        state.notes.errorCardIds.delete(card.id);
        card.id = 0;
        card.text = "";
        card.pinned = false;
        el.dataset.cardId = "0";
        el.classList.remove("pinned");
        el.classList.add("is-solo-empty");
        copyBtn.disabled = true;
        pinBtn.disabled = true;
        pinBtn.classList.remove("is-pinned");
        pinBtn.setAttribute("aria-pressed", "false");
        pinBtn.setAttribute("aria-label", "Pin to top");
        if (state.notes.timer) {
          clearTimeout(state.notes.timer);
          state.notes.timer = null;
        }
        if (hadSaved) {
          const key = convKey(currentConv());
          state.notes.conv = key;
          state.notes.seq += 1;
          state.notes.dirty = false;
          setNoteDot(false, "");
          saveNotesFor(key, currentNotesSnapshot(), state.notes.seq, false);
        } else {
          state.notes.dirty = false;
          setNoteDot(false, "");
        }
        syncNotesActions();
        return;
      }
      flushNoteSave();
    });

    el.addEventListener("click", (e) => {
      if (e.target.closest(".notes-action, .del-confirm-wrap")) return;
      if (el.classList.contains("is-solo")) {
        if (document.activeElement !== editor) {
          editor.focus();
        }
        return;
      }
      if (!el.classList.contains("expanded")) {
        expandNoteCard(el, true);
      }
    });

    el.appendChild(head);
    el.appendChild(editor);
    return el;
  }

  function renderNoteCards() {
    const vp = $("ws-viewport");
    vp.innerHTML = "";
    state.notes.expandedCardId = null;
    if (state.notes.cards.length === 0) {
      const soloCard = { id: 0, text: "", pinned: false };
      const el = buildNoteBlockElement(soloCard, true);
      vp.appendChild(el);
      syncCardSaveDots();
      requestAnimationFrame(() => syncScrollRail(vp, false));
      return;
    }
    for (const card of state.notes.cards) {
      const el = buildNoteBlockElement(card, false);
      vp.appendChild(el);
      const editor = el.querySelector(".block-editor");
      const { full, target } = applyAutoGrowHeight(editor, 22, NOTES_COLLAPSED_PX);
      editor.classList.toggle("is-clipped", full > target + 2);
    }
    syncCardSaveDots();
    requestAnimationFrame(() => syncScrollRail(vp, false));
  }

  function renderWorkspace() {
    if (isSearching()) {
      renderSearchResults($("search-input").value);
    } else {
      renderNoteCards();
    }
    syncNotesActions();
  }

  function animateNoteCardsReorder(vp, targetEl, shouldScrollToTarget, onBeforePlay) {
    const blocks = Array.from(vp.querySelectorAll(".note-block"));
    const firstTops = new Map();
    for (const el of blocks) {
      firstTops.set(el, el.getBoundingClientRect().top);
    }

    for (const el of blocks) {
      if (el._flipTimer) {
        clearTimeout(el._flipTimer);
        el._flipTimer = null;
      }
      el.style.transition = "none";
      el.style.transform = "";
      el.style.zIndex = "";
      el.style.position = "";
    }

    const elById = new Map();
    for (const el of blocks) {
      elById.set(Number(el.dataset.cardId), el);
    }

    const activeEditor =
      document.activeElement &&
      document.activeElement.classList &&
      document.activeElement.classList.contains("block-editor") &&
      vp.contains(document.activeElement)
        ? document.activeElement
        : null;
    const activeCard = activeEditor ? activeEditor.closest(".note-block") : null;
    const savedSelStart = activeEditor ? activeEditor.selectionStart : null;
    const savedSelEnd = activeEditor ? activeEditor.selectionEnd : null;
    if (activeCard) {
      activeCard._reordering = true;
    }

    if (targetEl) {
      const newIdx = state.notes.cards.findIndex((c) => c.id === Number(targetEl.dataset.cardId));
      if (newIdx >= 0) {
        let refEl = null;
        for (let j = newIdx + 1; j < state.notes.cards.length; j++) {
          const cand = elById.get(state.notes.cards[j].id);
          if (cand && cand !== targetEl) {
            refEl = cand;
            break;
          }
        }
        vp.insertBefore(targetEl, refEl);
      }
    }

    for (let i = 0; i < state.notes.cards.length; i++) {
      const wantEl = elById.get(state.notes.cards[i].id);
      if (!wantEl) continue;
      const curAtI = vp.children[i];
      if (curAtI !== wantEl) {
        vp.insertBefore(wantEl, curAtI || null);
      }
    }

    if (activeEditor && activeCard) {
      if (document.activeElement !== activeEditor) {
        try {
          activeEditor.focus({ preventScroll: true });
        } catch (_) {
          activeEditor.focus();
        }
        if (savedSelStart !== null && savedSelEnd !== null) {
          try {
            activeEditor.setSelectionRange(savedSelStart, savedSelEnd);
          } catch (_) {}
        }
      }
      activeCard._reordering = false;
    }

    if (shouldScrollToTarget && targetEl) {
      const targetScrollTop = Math.max(
        0,
        vp.scrollTop + (targetEl.getBoundingClientRect().top - vp.getBoundingClientRect().top)
      );
      if (vp.scrollTop > targetScrollTop) {
        vp.scrollTop = targetScrollTop;
      }
    }

    const vpRect = vp.getBoundingClientRect();
    const visTop = vpRect.top - 120;
    const visBot = vpRect.bottom + 120;
    const moving = [];

    for (const el of blocks) {
      const prevTop = firstTops.get(el);
      if (prevTop === undefined) {
        el.style.transition = "";
        continue;
      }
      const nextRect = el.getBoundingClientRect();
      const dy = prevTop - nextRect.top;
      const inView =
        (prevTop + nextRect.height >= visTop && prevTop <= visBot) ||
        (nextRect.bottom >= visTop && nextRect.top <= visBot);
      if (inView && Math.abs(dy) > 0.5) {
        el.style.transform = "translateY(" + dy.toFixed(2) + "px)";
        if (el === targetEl) {
          el.style.position = "relative";
          el.style.zIndex = "2";
        }
        moving.push(el);
      } else {
        el.style.transition = "";
      }
    }

    void vp.offsetHeight;

    for (const el of moving) {
      el.style.transition = "transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.28s ease, background-color 0.22s ease";
      el.style.transform = "";
      el._flipTimer = setTimeout(() => {
        el._flipTimer = null;
        el.style.transition = "";
        el.style.zIndex = "";
        el.style.position = "";
      }, 360);
    }

    if (onBeforePlay) {
      onBeforePlay();
    }

    setTimeout(() => syncScrollRail(vp, false), 365);
  }

  function togglePinNoteCard(cardId) {
    const oldIdx = state.notes.cards.findIndex((c) => c.id === cardId);
    if (oldIdx < 0) return;
    const card = state.notes.cards[oldIdx];
    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }
    card.pinned = !card.pinned;
    sortNoteCards();
    const newIdx = state.notes.cards.findIndex((c) => c.id === cardId);

    const vp = $("ws-viewport");
    const targetEl = vp.querySelector('.note-block[data-card-id="' + cardId + '"]');
    if (!targetEl) {
      renderWorkspace();
      if (card.pinned) {
        vp.scrollTop = 0;
      }
    } else {
      const pinBtn = targetEl.querySelector(".pin-btn");
      const pinLabel = card.pinned ? "Unpin card" : "Pin to top";
      const applyPinVisuals = () => {
        targetEl.classList.toggle("pinned", card.pinned);
        if (pinBtn) {
          pinBtn.classList.toggle("is-pinned", card.pinned);
          pinBtn.setAttribute("aria-label", pinLabel);
          pinBtn.setAttribute("aria-pressed", card.pinned ? "true" : "false");
        }
      };

      if (oldIdx === newIdx) {
        applyPinVisuals();
      } else {
        animateNoteCardsReorder(vp, targetEl, card.pinned, applyPinVisuals);
      }
    }

    const key = convKey(currentConv());
    state.notes.conv = key;
    state.notes.seq += 1;
    state.notes.dirty = false;
    setNoteDot(false, "");
    syncNotesActions();
    saveNotesFor(key, currentNotesSnapshot(), state.notes.seq, false);
  }

  function deleteNoteCard(cardId) {
    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }
    state.notes.cards = state.notes.cards.filter((c) => c.id !== cardId);
    state.notes.dirtyCardIds.delete(cardId);
    state.notes.errorCardIds.delete(cardId);
    if (state.notes.expandedCardId === cardId) {
      state.notes.expandedCardId = null;
    }
    renderWorkspace();
    const key = convKey(currentConv());
    state.notes.conv = key;
    state.notes.seq += 1;
    state.notes.dirty = false;
    setNoteDot(false, "");
    syncNotesActions();
    saveNotesFor(key, currentNotesSnapshot(), state.notes.seq, false);
  }

  async function syncNotesConv(conv) {
    const key = convKey(conv);
    if (state.notes.conv === key) return;

    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }
    const hadDirtyPrev = Boolean(state.notes.dirty && state.notes.conv);
    const prevKey = state.notes.conv;
    const prevSnap = hadDirtyPrev ? currentNotesSnapshot() : null;
    const prevSeq = state.notes.seq;

    cancelAllDeleteConfirms();
    state.notes.conv = key;
    state.notes.cards = [];
    state.notes.nextId = 1;
    state.notes.dirty = false;
    state.notes.seq = 0;
    state.notes.savedSeq = 0;
    setNoteDot(false, "");

    renderWorkspace();
    syncNotesActions();
    state.notes.loadingConv = key;

    if (hadDirtyPrev && prevKey && prevSnap) {
      await saveNotesFor(prevKey, prevSnap, prevSeq, false);
    }

    try {
      const q = new URLSearchParams({ conversationId: key });
      const res = await apiFetch("/api/notes?" + q.toString(), { method: "GET" });
      if (!res.ok) return;
      const data = await res.json();
      if (state.notes.conv === key && !state.notes.dirty && state.notes.seq === 0) {
        state.notes.cards = Array.isArray(data.cards)
          ? data.cards
              .map((c) => ({
                id: Number(c.id) || 1,
                text: String(c.text || ""),
                pinned: Boolean(c.pinned),
              }))
              .filter((c) => Boolean(c.text && c.text.trim()) || c.pinned)
          : [];
        sortNoteCards();
        state.notes.nextId = Number(data.next_id) || (state.notes.cards.length + 1);
        renderWorkspace();
        syncNotesActions();
      }
    } catch (_) {
    } finally {
      if (state.notes.loadingConv === key) {
        state.notes.loadingConv = "";
      }
    }
  }

  function syncNotesActions() {
    const count = state.notes.cards.length;
    const atCardLimit = count >= MAX_NOTE_CARDS;
    const addBtn = $("notes-add-btn");
    if (!addBtn) return;
    addBtn.disabled = atCardLimit;
    setTip(
      addBtn,
      atCardLimit
        ? "Maximum " + MAX_NOTE_CARDS + " cards per chat reached"
        : "New note card"
    );
  }

  function setWorkspaceMode(mode, focusInput) {
    const nextMode = mode === "search" ? "search" : "notes";
    const changed = state.notes.mode !== nextMode;
    if (changed) {
      if (state.notes.mode === "notes") {
        flushNoteSave();
      }
      state.notes.mode = nextMode;
      const isSearch = nextMode === "search";
      $("ws-card").classList.toggle("is-search-mode", isSearch);
      const sw = $("ws-mode-switch");
      if (sw) {
        sw.classList.toggle("is-search", isSearch);
        sw.querySelectorAll(".mode-tab").forEach((tab) => {
          const active = tab.dataset.mode === nextMode;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", active ? "true" : "false");
        });
      }
      if (isSearch) {
        const q = $("search-input").value;
        const conv = currentConv();
        if (q.trim() && (state.search.conv !== conv || state.search.lastScope !== state.search.scope)) {
          runChatSearch();
        } else {
          renderWorkspace();
        }
      } else {
        renderWorkspace();
      }
      setTimeout(() => {
        recalcVisibleCardsHeights();
      }, 235);
    }
    if (nextMode === "search" && focusInput !== false) {
      setTimeout(() => {
        const inp = $("search-input");
        if (inp) {
          try {
            inp.focus({ preventScroll: true });
          } catch (_) {
            inp.focus();
          }
        }
      }, changed ? 40 : 0);
    }
  }

  function clearSearchView(focusTarget) {
    if (state.search.timer) {
      clearTimeout(state.search.timer);
      state.search.timer = null;
    }
    if (state.search.aborter) {
      try { state.search.aborter.abort(); } catch (_) {}
      state.search.aborter = null;
    }
    state.search.seq += 1;
    $("search-input").value = "";
    state.search.query = "";
    state.search.results = [];
    state.search.total = 0;
    $("search-clear-btn").disabled = true;
    const countEl = $("search-count");
    countEl.textContent = "";
    countEl.classList.remove("visible");
    renderWorkspace();
    if (focusTarget === "search") {
      $("search-input").focus();
    }
  }

  $("notes-add-btn").addEventListener("mousedown", (e) => e.preventDefault());
  $("notes-add-btn").addEventListener("click", () => {
    if (state.notes.cards.length >= MAX_NOTE_CARDS) return;
    if (isSearching()) {
      setWorkspaceMode("notes", false);
    }

    const vp = $("ws-viewport");
    if (state.notes.cards.length === 0) {
      const soloEd = vp.querySelector(".note-block.is-solo .block-editor");
      if (soloEd) soloEd.focus();
      return;
    }

    const existingBlank = state.notes.cards.find((c) => !c.text.trim() && !c.pinned);
    if (existingBlank) {
      const blankEl = vp.querySelector('.note-block[data-card-id="' + existingBlank.id + '"]');
      if (blankEl) {
        expandNoteCard(blankEl, true);
        vp.scrollTo({ top: blankEl.offsetTop, behavior: "smooth" });
        return;
      }
    }

    if (state.notes.timer) {
      clearTimeout(state.notes.timer);
      state.notes.timer = null;
    }
    const newCard = {
      id: state.notes.nextId++,
      text: "",
      pinned: false,
    };
    state.notes.cards.unshift(newCard);
    sortNoteCards();
    renderNoteCards();
    const newEl = vp.querySelector('.note-block[data-card-id="' + newCard.id + '"]');
    if (newEl) {
      vp.scrollTop = Math.max(0, newEl.offsetTop - 4);
      expandNoteCard(newEl, true);
    }
    syncNotesActions();
  });

  function recalcVisibleCardsHeights() {
    const wsEl = document.querySelector(".workspace-area");
    if (!wsEl || wsEl.clientWidth === 0) return;
    const vp = $("ws-viewport");
    if (isSearching()) {
      vp.querySelectorAll(".search-block").forEach((cardEl) => {
        const body = cardEl.querySelector(".search-body");
        if (!body) return;
        const expanded = cardEl.classList.contains("expanded");
        body.style.transition = "none";
        body.style.height = "auto";
        const fullH = Math.max(20, body.scrollHeight);
        const cap = expanded ? maxExpandedHeightPx() : SEARCH_COLLAPSED_PX;
        const targetH = Math.min(fullH, cap);
        body.style.overflowY = expanded && fullH > targetH ? "auto" : "hidden";
        body.style.height = targetH + "px";
        void body.offsetHeight;
        body.style.transition = "";
      });
    } else {
      vp.querySelectorAll(".note-block").forEach((cardEl) => {
        if (cardEl.classList.contains("is-solo")) return;
        const ed = cardEl.querySelector(".block-editor");
        if (!ed) return;
        const expanded = cardEl.classList.contains("expanded");
        const maxH = expanded ? maxNoteBlockEditorHeightPx(cardEl, ed) : NOTES_COLLAPSED_PX;
        const { full, target } = applyAutoGrowHeight(ed, 22, maxH);
        ed.classList.toggle("is-clipped", !expanded && full > target + 2);
      });
    }
    syncScrollRail(vp, false);
  }

  /* Chat Context Search */
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function parseQueryTerms(rawQuery) {
    const trimmed = (rawQuery || "").trim();
    if (!trimmed) return [];
    if (
      trimmed.length >= 2 &&
      ((trimmed.startsWith('"') && trimmed.endsWith('"')) ||
        (trimmed.startsWith("«") && trimmed.endsWith("»")))
    ) {
      const inner = trimmed.slice(1, -1).trim().toLowerCase();
      return inner ? [inner] : [];
    }
    return trimmed
      .split(/\s+/)
      .map((w) => w.toLowerCase())
      .filter(Boolean);
  }

  function findFocusMatchRange(lowerText, terms) {
    if (!lowerText || !terms.length) return null;
    if (terms.length === 1) {
      const idx = lowerText.indexOf(terms[0]);
      return idx >= 0 ? [idx, idx + terms[0].length] : null;
    }
    const phrase = terms.join(" ");
    const pIdx = lowerText.indexOf(phrase);
    if (pIdx >= 0) {
      return [pIdx, pIdx + phrase.length];
    }

    const uniq = [];
    for (const t of terms) {
      if (!uniq.includes(t)) uniq.push(t);
    }
    if (uniq.length === 1) {
      const idx = lowerText.indexOf(uniq[0]);
      return idx >= 0 ? [idx, idx + uniq[0].length] : null;
    }

    const occs = [];
    for (const t of uniq) {
      const list = [];
      let pos = 0;
      while (pos < lowerText.length && list.length < 64) {
        const idx = lowerText.indexOf(t, pos);
        if (idx < 0) break;
        list.push([idx, idx + t.length]);
        pos = idx + t.length;
      }
      if (list.length === 0) return null;
      occs.push(list);
    }

    const ptrs = new Array(occs.length).fill(0);
    let best = null;
    while (true) {
      let minTi = 0;
      let minStart = Infinity;
      let maxEnd = 0;
      let firstTermEnd = 0;
      for (let ti = 0; ti < occs.length; ti++) {
        const [s, e] = occs[ti][ptrs[ti]];
        if (s < minStart) {
          minStart = s;
          minTi = ti;
          firstTermEnd = e;
        }
        if (e > maxEnd) maxEnd = e;
      }
      const span = maxEnd - minStart;
      if (!best || span < best[0]) {
        best = [span, minStart, firstTermEnd, maxEnd];
      }
      ptrs[minTi] += 1;
      if (ptrs[minTi] >= occs[minTi].length) break;
    }
    return best ? [best[1], best[2], best[3]] : null;
  }

  function highlightHtml(text, query) {
    if (!text) return "";
    const terms = parseQueryTerms(query);
    if (terms.length === 0) return escapeHtml(text);
    const lowerText = text.toLowerCase();
    if (lowerText.length !== text.length) {
      return escapeHtml(text);
    }

    const ranges = [];
    for (const term of terms) {
      let pos = 0;
      while (pos < lowerText.length) {
        const idx = lowerText.indexOf(term, pos);
        if (idx < 0) break;
        ranges.push([idx, idx + term.length]);
        pos = idx + term.length;
      }
    }
    if (ranges.length === 0) return escapeHtml(text);

    ranges.sort((a, b) => (a[0] !== b[0] ? a[0] - b[0] : b[1] - a[1]));
    const merged = [ranges[0]];
    for (let i = 1; i < ranges.length; i++) {
      const prev = merged[merged.length - 1];
      const cur = ranges[i];
      if (cur[0] <= prev[1]) {
        if (cur[1] > prev[1]) prev[1] = cur[1];
      } else {
        merged.push(cur);
      }
    }

    const focus = findFocusMatchRange(lowerText, terms);
    const focusStart = focus ? focus[0] : merged[0][0];
    const focusEnd = focus ? focus[1] : merged[0][1];
    let markedFocus = false;

    let out = "";
    let cursor = 0;
    for (const [start, end] of merged) {
      if (start > cursor) {
        out += escapeHtml(text.slice(cursor, start));
      }
      const isFocus = !markedFocus && end > focusStart && start < focusEnd;
      if (isFocus) markedFocus = true;
      out += (isFocus ? '<mark class="is-focus">' : "<mark>") + escapeHtml(text.slice(start, end)) + "</mark>";
      cursor = end;
    }
    if (cursor < text.length) {
      out += escapeHtml(text.slice(cursor));
    }
    return out;
  }

  function roleBadgeInfo(role) {
    if (role === "note") return { label: "Note", cls: "role-note" };
    if (role === "user") return { label: "You", cls: "role-user" };
    if (role === "summary") return { label: "Summary", cls: "role-summary" };
    return { label: "Agent", cls: "" };
  }

  function collapseSearchBlock(cardEl) {
    if (!cardEl || !cardEl.classList.contains("expanded")) return;
    const body = cardEl.querySelector(".search-body");
    const snippetHtml = cardEl._snippetHtml || "";
    const startH = body.offsetHeight;

    body.style.transition = "none";
    body.innerHTML = snippetHtml;
    body.style.height = "auto";
    const targetH = Math.min(Math.max(20, body.scrollHeight), SEARCH_COLLAPSED_PX);
    body.style.height = startH + "px";
    void body.offsetHeight;
    body.style.transition = "";

    cardEl.classList.remove("expanded");
    body.scrollTop = 0;
    body.style.overflowY = "hidden";
    body.style.height = targetH + "px";
    setTimeout(() => syncScrollRail($("ws-viewport"), false), 300);
  }

  function collapseAllSearchBlocks(exceptEl) {
    $("ws-viewport").querySelectorAll(".search-block.expanded").forEach((el) => {
      if (exceptEl && el === exceptEl) return;
      collapseSearchBlock(el);
    });
  }

  function expandSearchBlock(cardEl) {
    collapseAllSearchBlocks(cardEl);
    const body = cardEl.querySelector(".search-body");
    const fullHtml = cardEl._fullHtml || "";
    const startH = body.offsetHeight;

    body.style.transition = "none";
    body.innerHTML = fullHtml;
    body.style.height = "auto";
    const fullH = Math.max(20, body.scrollHeight);
    const targetH = Math.min(fullH, maxExpandedHeightPx());

    let markCenterY = -1;
    const targetMark = body.querySelector("mark.is-focus") || body.querySelector("mark");
    if (targetMark && fullH > targetH) {
      const mRect = targetMark.getBoundingClientRect();
      const bRect = body.getBoundingClientRect();
      markCenterY = (mRect.top - bRect.top) + mRect.height / 2;
    }

    const scrollForHeight = (h) => {
      if (markCenterY < 0 || fullH <= h) return 0;
      return Math.max(0, Math.min(fullH - h, Math.round(markCenterY - h / 2)));
    };

    body.style.height = startH + "px";
    body.style.overflowY = fullH > targetH ? "auto" : "hidden";
    if (markCenterY >= 0) {
      body.scrollTop = scrollForHeight(startH);
    }
    void body.offsetHeight;
    body.style.transition = "";

    cardEl.classList.add("expanded");
    body.style.height = targetH + "px";

    if (markCenterY >= 0) {
      const animEnd = Date.now() + 310;
      const keepCentered = () => {
        if (!cardEl.classList.contains("expanded")) return;
        const h = body.clientHeight || targetH;
        body.scrollTop = scrollForHeight(h);
        if (Date.now() < animEnd) {
          requestAnimationFrame(keepCentered);
        } else {
          body.scrollTop = scrollForHeight(targetH);
        }
      };
      requestAnimationFrame(keepCentered);
    }
    setTimeout(() => {
      cardEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
      syncScrollRail($("ws-viewport"), false);
    }, 300);
  }

  function buildLocalSnippet(text, matchStart, matchEnd) {
    const beforeCtx = 55;
    const afterCtx = 140;
    const start = Math.max(0, matchStart - beforeCtx);
    const end = Math.min(text.length, Math.max(matchEnd, matchStart + afterCtx));
    return (start > 0 ? "…" : "") + text.slice(start, end).trim() + (end < text.length ? "…" : "");
  }

  function searchLocalNotes(query) {
    const terms = parseQueryTerms(query);
    if (terms.length === 0) return [];
    const conv = currentConv();
    const curTitle = state.lastData && state.lastData.chat_title ? state.lastData.chat_title : "Current chat";
    const matches = [];
    for (const card of state.notes.cards) {
      const txt = (card.text || "").trim();
      if (!txt) continue;
      const lower = txt.toLowerCase();
      if (!terms.every((t) => lower.includes(t))) continue;
      const focus = findFocusMatchRange(lower, terms);
      if (!focus) continue;
      const [mStart, mFirstEnd, mWinEnd] = focus;
      const winEnd = mWinEnd !== undefined ? mWinEnd : mFirstEnd;
      let rank = 2;
      if (terms.length === 1 || lower.indexOf(terms.join(" ")) >= 0) {
        rank = 0;
      } else if (winEnd - mStart <= 160) {
        rank = 1;
      }
      matches.push({
        conv_id: conv,
        chat_title: curTitle,
        is_current: true,
        chat_archived: false,
        step_index: card.id,
        role: "note",
        created_at: "",
        archived: false,
        rank,
        pinned: Boolean(card.pinned),
        snippet: buildLocalSnippet(txt, mStart, winEnd),
        text: txt,
      });
    }
    matches.sort((a, b) => {
      if (a.rank !== b.rank) return a.rank - b.rank;
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return b.step_index - a.step_index;
    });
    return matches;
  }

  function openConversationInHost(convId) {
    if (!convId || convId === DRAFT_KEY) return;
    if (window.sidecar && window.sidecar.ui && typeof window.sidecar.ui.toggleConversation === "function") {
      window.sidecar.ui.toggleConversation(convId);
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: "toggle-conversation",
        payload: { conversationId: convId },
      }, "*");
    }
  }

  function renderSearchResults(query) {
    const vp = $("ws-viewport");
    const countEl = $("search-count");
    const isAllScope = state.search.scope === "all";
    vp.innerHTML = "";

    if (!query.trim()) {
      countEl.textContent = "";
      countEl.classList.remove("visible");
      vp.innerHTML = isAllScope
        ? '<div class="search-empty">Type to search all chats &amp; notes</div>'
        : '<div class="search-empty">Type to search this chat &amp; its notes</div>';
      syncScrollRail(vp, false);
      return;
    }

    const localNotes = searchLocalNotes(query);
    const serverResults = Array.isArray(state.search.results) ? state.search.results : [];
    const combined = localNotes.concat(serverResults);
    combined.sort((a, b) => {
      const ra = typeof a.rank === "number" ? a.rank : 2;
      const rb = typeof b.rank === "number" ? b.rank : 2;
      if (ra !== rb) return ra - rb;
      const aNote = a.role === "note" ? 0 : 1;
      const bNote = b.role === "note" ? 0 : 1;
      if (aNote !== bNote) return aNote - bNote;
      if (a.role === "note" && b.role === "note" && Boolean(a.pinned) !== Boolean(b.pinned)) {
        return a.pinned ? -1 : 1;
      }
      const ca = a.created_at || "";
      const cb = b.created_at || "";
      if (ca !== cb) return cb > ca ? 1 : -1;
      return (Number(b.step_index) || 0) - (Number(a.step_index) || 0);
    });
    const results = combined.slice(0, 60);
    const serverTotal = Number(state.search.total) || 0;
    const total = localNotes.length + serverTotal;

    if (results.length === 0) {
      countEl.textContent = "0";
      countEl.classList.add("visible");
      vp.innerHTML = '<div class="search-empty">No matches found</div>';
      syncScrollRail(vp, false);
      return;
    }

    countEl.textContent = total > results.length ? (results.length + "+") : String(total);
    countEl.classList.add("visible");

    for (const r of results) {
      const el = document.createElement("div");
      el.className = "search-block";
      el.dataset.stepIndex = String(r.step_index);

      const head = document.createElement("div");
      head.className = "block-head";

      const meta = document.createElement("div");
      meta.className = "block-meta";

      const badge = roleBadgeInfo(r.role);
      const roleSpan = document.createElement("span");
      roleSpan.className = "search-role" + (badge.cls ? " " + badge.cls : "");
      roleSpan.textContent = badge.label;
      meta.appendChild(roleSpan);

      if (r.archived) {
        const arch = document.createElement("span");
        arch.className = "search-archived";
        arch.textContent = "before compact";
        meta.appendChild(arch);
      }

      if (r.created_at) {
        const ts = document.createElement("span");
        ts.textContent = fmtDateTime(r.created_at);
        meta.appendChild(ts);
      }

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "notes-action";
      copyBtn.setAttribute("aria-label", r.role === "note" ? "Copy note" : "Copy full message");
      copyBtn.innerHTML = ICON_COPY;
      copyBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (await copyPlainText(r.text)) {
          flashCheckButton(copyBtn);
        }
      });

      head.appendChild(copyBtn);
      head.appendChild(meta);

      const body = document.createElement("div");
      body.className = "search-body";
      const snippetHtml = highlightHtml(r.snippet || "", query);
      const fullHtml = highlightHtml(r.text || "", query);
      el._snippetHtml = snippetHtml;
      el._fullHtml = fullHtml;
      body.innerHTML = snippetHtml;
      attachCtxMenu(body);
      bindAutoHideScrollbar(body);

      el.addEventListener("click", (e) => {
        if (e.target.closest(".notes-action, .search-chat-title.is-link")) return;
        if (!el.classList.contains("expanded")) {
          expandSearchBlock(el);
        }
      });

      el.appendChild(head);
      if (isAllScope && r.chat_title) {
        const isCurrent = Boolean(r.is_current);
        const isArchived = !isCurrent && Boolean(r.chat_archived);
        const canJump = !isCurrent && Boolean(r.conv_id) && r.conv_id !== DRAFT_KEY;
        const suffix = isCurrent ? " · current" : (isArchived ? " · archived" : "");
        const titleText = r.chat_title + suffix;
        if (canJump) {
          const titleBtn = document.createElement("button");
          titleBtn.type = "button";
          titleBtn.className = "search-chat-title is-link";
          const txtSpan = document.createElement("span");
          txtSpan.className = "search-chat-title-text";
          txtSpan.textContent = titleText;
          const jumpSpan = document.createElement("span");
          jumpSpan.className = "search-chat-jump";
          jumpSpan.setAttribute("aria-hidden", "true");
          jumpSpan.textContent = "↗";
          titleBtn.appendChild(txtSpan);
          titleBtn.appendChild(jumpSpan);
          setTip(titleBtn, "Open chat: " + r.chat_title);
          titleBtn.addEventListener("mousedown", (e) => e.preventDefault());
          titleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openConversationInHost(r.conv_id);
          });
          el.appendChild(titleBtn);
        } else {
          const titleEl = document.createElement("div");
          titleEl.className = "search-chat-title" + (isCurrent ? " is-current" : "");
          titleEl.textContent = titleText;
          titleEl.setAttribute("data-tip-overflow", "1");
          setTip(titleEl, titleText);
          el.appendChild(titleEl);
        }
      }
      el.appendChild(body);
      vp.appendChild(el);

      const targetH = Math.min(Math.max(20, body.scrollHeight), SEARCH_COLLAPSED_PX);
      body.style.height = targetH + "px";
    }

    vp.scrollTop = 0;
    requestAnimationFrame(() => syncScrollRail(vp, false));
  }

  async function runChatSearch() {
    const query = $("search-input").value;
    state.search.query = query;
    const conv = currentConv();
    const scope = state.search.scope === "all" ? "all" : "this";
    state.search.conv = conv;
    state.search.lastScope = scope;
    const mySeq = ++state.search.seq;

    if (state.search.aborter) {
      try { state.search.aborter.abort(); } catch (_) {}
      state.search.aborter = null;
    }

    $("search-clear-btn").disabled = !query;

    if (!query.trim()) {
      state.search.results = [];
      state.search.total = 0;
      renderWorkspace();
      return;
    }

    if (!conv && scope !== "all") {
      state.search.results = [];
      state.search.total = 0;
      renderSearchResults(query);
      return;
    }

    const aborter = typeof AbortController === "function" ? new AbortController() : null;
    state.search.aborter = aborter;

    try {
      const q = new URLSearchParams({ conversationId: conv, q: query, scope });
      const opts = { method: "GET" };
      if (aborter) opts.signal = aborter.signal;
      const res = await apiFetch("/api/search?" + q.toString(), opts);
      if (!res.ok) return;
      const data = await res.json();
      if (mySeq !== state.search.seq) return;
      state.search.results = Array.isArray(data.results) ? data.results : [];
      state.search.total = Number(data.total) || state.search.results.length;
      renderSearchResults(query);
    } catch (_) {
    } finally {
      if (state.search.aborter === aborter) {
        state.search.aborter = null;
      }
    }
  }

  document.querySelectorAll(".mode-tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      setWorkspaceMode(tab.dataset.mode);
    });
  });

  $("search-scope-btn").addEventListener("click", () => {
    const nextScope = state.search.scope === "all" ? "this" : "all";
    state.search.scope = nextScope;
    const isThisOnly = nextScope === "this";
    const btn = $("search-scope-btn");
    btn.classList.toggle("is-active", isThisOnly);
    btn.setAttribute("aria-pressed", isThisOnly ? "true" : "false");
    setTip(
      btn,
      isThisOnly
        ? "Searching only this chat's messages & notes (click for all chats)"
        : "Search only this chat's messages & notes"
    );
    $("search-input").placeholder = isThisOnly
      ? "Search this chat & its notes…"
      : "Search all chats & notes…";
    if (state.search.timer) {
      clearTimeout(state.search.timer);
      state.search.timer = null;
    }
    if (!isSearching()) {
      setWorkspaceMode("search");
    } else {
      runChatSearch();
    }
  });

  $("search-input").addEventListener("input", () => {
    const val = $("search-input").value;
    $("search-clear-btn").disabled = !val;
    state.search.query = val;
    if (state.search.timer) clearTimeout(state.search.timer);
    if (!val.trim()) {
      clearSearchView("search");
      return;
    }
    const delay = state.search.scope === "all" ? 240 : 150;
    state.search.timer = setTimeout(() => {
      state.search.timer = null;
      runChatSearch();
    }, delay);
  });

  $("search-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      if (state.search.timer) {
        clearTimeout(state.search.timer);
        state.search.timer = null;
      }
      runChatSearch();
    } else if (e.key === "Escape" && $("search-input").value) {
      e.preventDefault();
      clearSearchView("search");
    }
  });

  $("search-clear-btn").addEventListener("click", () => {
    clearSearchView("search");
  });

  /* About-style Outside Click / Key Auto-Collapse for Expanded Blocks & Delete Confirms */
  function selectionInsideEl(el) {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return false;
    return el.contains(sel.getRangeAt(0).commonAncestorContainer);
  }

  document.addEventListener("pointerdown", (e) => {
    if (!e.target.closest(".del-confirm-wrap.confirming")) {
      cancelAllDeleteConfirms();
    }
    if (e.target.closest("#ctx-menu")) return;

    const expNote = $("ws-viewport").querySelector(".note-block.expanded");
    if (expNote && !expNote.contains(e.target)) {
      collapseNoteCard(expNote);
    }
    const expSearch = $("ws-viewport").querySelector(".search-block.expanded");
    if (expSearch && !expSearch.contains(e.target)) {
      collapseSearchBlock(expSearch);
    }
  }, true);

  document.addEventListener("keydown", (e) => {
    if (["Shift", "Control", "Alt", "Meta", "AltGraph"].includes(e.key)) return;

    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.code === "KeyF") {
      e.preventDefault();
      setWorkspaceMode("search", false);
      $("search-input").focus();
      $("search-input").select();
      return;
    }

    if (e.key === "Escape") {
      cancelAllDeleteConfirms();
    }

    const expNote = $("ws-viewport").querySelector(".note-block.expanded");
    if (expNote) {
      const editor = expNote.querySelector(".block-editor");
      const hasEditorSel = editor && (editor.selectionEnd || 0) > (editor.selectionStart || 0);
      if ((e.ctrlKey || e.metaKey) && e.code === "KeyC" && (hasEditorSel || selectionInsideEl(expNote))) {
        return;
      }
      if (!expNote.contains(e.target) || e.key === "Escape") {
        if (!$("ctx-menu").classList.contains("open")) {
          collapseNoteCard(expNote);
        }
      }
    }

    const expSearch = $("ws-viewport").querySelector(".search-block.expanded");
    if (expSearch) {
      if ((e.ctrlKey || e.metaKey) && e.code === "KeyC" && selectionInsideEl(expSearch)) {
        return;
      }
      if (!expSearch.contains(e.target) || e.key === "Escape") {
        if (!$("ctx-menu").classList.contains("open")) {
          collapseSearchBlock(expSearch);
        }
      }
    }
  }, true);

  /* Custom Antigravity-style Context Menu */
  let ctxTarget = null;
  let ctxCapturedSel = "";

  function isFormTextTarget(el) {
    return el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement;
  }

  function getElementSelectedText(el) {
    if (!el) return "";
    if (isFormTextTarget(el)) {
      const start = el.selectionStart || 0;
      const end = el.selectionEnd || 0;
      return end > start ? el.value.slice(start, end) : "";
    }
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return "";
    const range = sel.getRangeAt(0);
    if (!el.contains(range.commonAncestorContainer) && !range.intersectsNode(el)) {
      return "";
    }
    return sel.toString();
  }

  function closeCtxMenu() {
    $("ctx-menu").classList.remove("open");
    ctxTarget = null;
    ctxCapturedSel = "";
  }

  function replaceTargetSelection(el, text) {
    el.focus();
    const ok = document.execCommand && document.execCommand("insertText", false, text);
    if (!ok) {
      const start = el.selectionStart || 0;
      const end = el.selectionEnd || 0;
      el.setRangeText(text, start, end, "end");
      el.dispatchEvent(new Event("input", { bubbles: true }));
    }
  }

  function openCtxMenu(target, x, y) {
    hideTip(true);
    ctxTarget = target;
    ctxCapturedSel = getElementSelectedText(target);
    const menu = $("ctx-menu");
    const isForm = isFormTextTarget(target);
    const hasSel = Boolean(ctxCapturedSel);
    const isReadonly = !isForm || Boolean(target.readOnly);
    const hasContent = isForm ? Boolean(target.value) : Boolean(target.textContent);
    menu.querySelector('[data-act="cut"]').disabled = !hasSel || isReadonly;
    menu.querySelector('[data-act="copy"]').disabled = !hasSel;
    menu.querySelector('[data-act="paste"]').disabled = isReadonly;
    menu.querySelector('[data-act="selectAll"]').disabled = !hasContent;

    menu.classList.add("open");
    const mw = menu.offsetWidth || 88;
    const mh = menu.offsetHeight || 124;
    const left = Math.max(6, Math.min(x, window.innerWidth - mw - 6));
    const top = Math.max(6, Math.min(y, window.innerHeight - mh - 6));
    menu.style.left = left + "px";
    menu.style.top = top + "px";
  }

  function attachCtxMenu(el) {
    if (!el || el._hasCtxMenu) return;
    el._hasCtxMenu = true;
    el.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      if (el.classList.contains("block-editor")) {
        const card = el.closest(".note-block");
        if (card && !card.classList.contains("expanded")) {
          expandNoteCard(card, true);
        }
      } else if (el.classList.contains("search-body")) {
        const card = el.closest(".search-block");
        if (card && !card.classList.contains("expanded")) {
          expandSearchBlock(card);
        }
      }
      openCtxMenu(el, e.clientX, e.clientY);
    });
  }

  attachCtxMenu($("in-at"));
  attachCtxMenu($("search-input"));

  $("ctx-menu").addEventListener("mousedown", (e) => {
    e.preventDefault();
  });

  $("ctx-menu").addEventListener("click", async (e) => {
    const btn = e.target.closest(".ctx-item");
    if (!btn || btn.disabled || !ctxTarget) return;
    const target = ctxTarget;
    const captured = ctxCapturedSel;
    const act = btn.dataset.act;
    closeCtxMenu();

    if (!isFormTextTarget(target)) {
      const textToCopy = captured || getElementSelectedText(target);
      if (act === "copy" && textToCopy) {
        await copyPlainText(textToCopy);
      } else if (act === "selectAll") {
        const range = document.createRange();
        range.selectNodeContents(target);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      return;
    }

    target.focus();
    const start = target.selectionStart || 0;
    const end = target.selectionEnd || 0;
    const selected = target.value.slice(start, end);

    if (act === "cut" && selected) {
      try {
        await navigator.clipboard.writeText(selected);
      } catch (_) {
        document.execCommand("copy");
      }
      const deleted = document.execCommand && document.execCommand("delete");
      if (!deleted) {
        target.setRangeText("", start, end, "start");
        target.dispatchEvent(new Event("input", { bubbles: true }));
      }
    } else if (act === "copy" && selected) {
      try {
        await navigator.clipboard.writeText(selected);
      } catch (_) {
        document.execCommand("copy");
      }
    } else if (act === "paste") {
      try {
        const clip = await navigator.clipboard.readText();
        if (clip !== undefined && clip !== null) {
          replaceTargetSelection(target, clip);
        }
      } catch (_) {
        document.execCommand("paste");
      }
    } else if (act === "selectAll") {
      target.select();
    }
  });

  document.addEventListener("mousedown", (e) => {
    if (!e.target.closest("#ctx-menu")) {
      closeCtxMenu();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeCtxMenu();
  });

  function fmtResetIn(iso) {
    if (!iso) return "";
    const ts = Date.parse(iso);
    if (!Number.isFinite(ts)) return "";
    const diffSec = Math.floor((ts - Date.now()) / 1000);
    if (diffSec <= 0) return "";
    const mins = Math.floor(diffSec / 60);
    const hrs = Math.floor(mins / 60);
    const days = Math.floor(hrs / 24);
    if (days >= 2) return days + "d";
    if (days === 1) {
      const remH = hrs % 24;
      return remH > 0 ? ("1d " + remH + "h") : "1d";
    }
    if (hrs >= 1) {
      const remM = mins % 60;
      return remM > 0 ? (hrs + "h " + remM + "m") : (hrs + "h");
    }
    return Math.max(1, mins) + "m";
  }

  const QUOTA_CIRC = 41.47;

  function quotaColor(pct) {
    if (pct <= 30) return "var(--am-crit)";
    if (pct <= 65) return "var(--am-warn1)";
    return "var(--am-ok)";
  }

  function applyQuotaBucket(elId, bucket) {
    const el = $(elId);
    if (!el) return;
    if (!bucket) {
      el.classList.add("hidden");
      setTip(el, "");
      return;
    }
    el.classList.remove("hidden");
    const pct = Math.max(0, Math.min(100, Math.round(Number(bucket.pct) || 0)));
    const fill = el.querySelector(".quota-ring-fill");
    if (fill) {
      fill.style.stroke = quotaColor(pct);
      fill.style.strokeDashoffset = (QUOTA_CIRC * (1 - pct / 100)).toFixed(2);
      fill.style.opacity = pct <= 0 ? "0" : "1";
    }
    const pctEl = el.querySelector(".quota-pct");
    if (pctEl) {
      pctEl.textContent = pct + "%";
    }
    const resetStr = fmtResetIn(bucket.reset_time);
    setTip(el, resetStr ? ("Resets in " + resetStr) : "");
  }

  function renderQuota(q) {
    const row = $("quota-row");
    if (!row) return;
    if (!q || !q.available) {
      row.classList.remove("visible");
      return;
    }
    const gEl = $("quota-gemini");
    const oEl = $("quota-other");
    const hasG = Boolean(q.gemini && (q.gemini.weekly || q.gemini.five_hour));
    const hasO = Boolean(q.other && (q.other.weekly || q.other.five_hour));
    if (!hasG && !hasO) {
      row.classList.remove("visible");
      return;
    }
    if (gEl) gEl.classList.toggle("hidden", !hasG);
    if (oEl) oEl.classList.toggle("hidden", !hasO);
    if (hasG) {
      applyQuotaBucket("q-g-w", q.gemini.weekly);
      applyQuotaBucket("q-g-h", q.gemini.five_hour);
    }
    if (hasO) {
      applyQuotaBucket("q-o-w", q.other.weekly);
      applyQuotaBucket("q-o-h", q.other.five_hour);
    }
    row.classList.add("visible");
  }

  function parseSemverStable(ver) {
    if (!ver || typeof ver !== "string") return null;
    const clean = ver.trim().replace(/^[vV]/, "");
    if (clean.includes("-")) return null;
    const m = clean.match(/^(\d{1,6})\.(\d{1,6})\.(\d{1,6})$/);
    if (!m) return null;
    return [parseInt(m[1], 10), parseInt(m[2], 10), parseInt(m[3], 10)];
  }

  function isNewerVersion(candidate, current) {
    const a = parseSemverStable(candidate);
    const b = parseSemverStable(current);
    if (!a || !b) return false;
    if (a[0] !== b[0]) return a[0] > b[0];
    if (a[1] !== b[1]) return a[1] > b[1];
    return a[2] > b[2];
  }

  function applyUpdateBadge(latestVer) {
    const clean = latestVer ? String(latestVer).trim().replace(/^[vV]/, "") : "";
    state.latestVersion = clean;
    const hasNew = isNewerVersion(clean, APP_VERSION);
    const aboutBtn = $("about-btn");
    const updLink = $("about-update-link");
    if (aboutBtn) {
      aboutBtn.classList.toggle("has-update", hasNew);
      setTip(aboutBtn, hasNew ? ("Update v" + clean + " available") : "");
    }
    if (updLink) {
      if (hasNew) {
        updLink.href = GITHUB_RELEASES_URL;
        updLink.textContent = "Update available: v" + clean + " ↗";
        updLink.classList.add("visible");
      } else {
        updLink.textContent = "";
        updLink.classList.remove("visible");
      }
    }
  }

  async function maybeCheckForUpdates(loadStoredFirst) {
    if (state.updateCheckInFlight) return;
    if (loadStoredFirst) {
      try {
        const res = await apiFetch("/api/update-state", { method: "GET" });
        if (res.ok) {
          const data = await res.json();
          state.updateCheckedAt = Number(data.checked_at) || 0;
          if (data.latest_version) {
            applyUpdateBadge(data.latest_version);
          }
        }
      } catch (_) {}
    }

    const nowSec = Math.floor(Date.now() / 1000);
    if (state.updateCheckedAt > 0 && (nowSec - state.updateCheckedAt) < UPDATE_CHECK_INTERVAL_SEC) {
      return;
    }
    if (Date.now() < state.updateRetryAfterMs) {
      return;
    }
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      return;
    }

    state.updateCheckInFlight = true;
    const aborter = typeof AbortController === "function" ? new AbortController() : null;
    const timeoutId = aborter ? setTimeout(() => {
      try { aborter.abort(); } catch (_) {}
    }, 6000) : null;
    try {
      const opts = {
        method: "GET",
        cache: "no-store",
        credentials: "omit",
        headers: { Accept: "application/vnd.github+json" },
      };
      if (aborter) opts.signal = aborter.signal;
      const ghRes = await fetch(GITHUB_LATEST_API, opts);
      if (!ghRes.ok) {
        state.updateRetryAfterMs = Date.now() + 3600000;
        return;
      }
      const rel = await ghRes.json();
      const rawTag = rel && typeof rel.tag_name === "string" ? rel.tag_name.trim().replace(/^[vV]/, "") : "";
      if (!parseSemverStable(rawTag)) {
        state.updateRetryAfterMs = Date.now() + 3600000;
        return;
      }
      const checkedSec = Math.floor(Date.now() / 1000);
      state.updateCheckedAt = checkedSec;
      applyUpdateBadge(rawTag);
      await apiFetch("/api/update-state", {
        method: "POST",
        body: JSON.stringify({ checked_at: checkedSec, latest_version: rawTag }),
      }).catch(() => {});
    } catch (_) {
      state.updateRetryAfterMs = Date.now() + 3600000;
    } finally {
      if (timeoutId) clearTimeout(timeoutId);
      state.updateCheckInFlight = false;
    }
  }

  const quotaChannel = (() => {
    try {
      return typeof BroadcastChannel === "function" ? new BroadcastChannel("antimetro-quota") : null;
    } catch (_) {
      return null;
    }
  })();

  if (quotaChannel) {
    quotaChannel.onmessage = (ev) => {
      const q = ev && ev.data;
      if (q && typeof q === "object") {
        state.lastQuota = q;
        renderQuota(q);
      }
    };
  }

  function applyActiveQuotaGroup(group) {
    const gEl = $("quota-gemini");
    const oEl = $("quota-other");
    if (gEl) gEl.classList.toggle("is-active-group", group === "gemini");
    if (oEl) oEl.classList.toggle("is-active-group", group === "other");
  }

  function expiredQuotaResetKey(q) {
    if (!q || !q.available) return "";
    const now = Date.now();
    const expired = [];
    const buckets = [
      q.gemini && q.gemini.weekly,
      q.gemini && q.gemini.five_hour,
      q.other && q.other.weekly,
      q.other && q.other.five_hour,
    ];
    for (const b of buckets) {
      if (!b || !b.reset_time) continue;
      const pct = Math.round(Number(b.pct) || 0);
      if (pct >= 100) continue;
      const ts = Date.parse(b.reset_time);
      if (Number.isFinite(ts) && ts <= now) {
        expired.push(b.reset_time);
      }
    }
    return expired.join("|");
  }

  function triggerForceQuotaNow() {
    if (state.quotaActiveTimer) {
      clearTimeout(state.quotaActiveTimer);
      state.quotaActiveTimer = null;
    }
    state.lastQuotaForceAt = Date.now();
    if (!document.hidden) {
      fetchQuota(true);
    }
  }

  async function fetchQuota(force) {
    try {
      const url = force ? "/api/quota?force=1" : "/api/quota";
      const res = await apiFetch(url, { method: "GET" });
      if (!res.ok) return;
      const data = await res.json();
      state.lastQuota = data;
      renderQuota(data);
      if (quotaChannel && data && data.available) {
        try {
          quotaChannel.postMessage(data);
        } catch (_) {}
      }
    } catch (_) {
    }
  }

  function scheduleQuotaLoop() {
    if (state.quotaTimer) clearTimeout(state.quotaTimer);
    state.quotaTimer = setTimeout(async () => {
      state.quotaTimer = null;
      if (!document.hidden) {
        const expKey = expiredQuotaResetKey(state.lastQuota);
        const now = Date.now();
        const needForceReset =
          Boolean(expKey) &&
          (expKey !== state.lastExpiredResetForceKey || (now - state.lastExpiredResetForceAt) >= 300000);
        if (needForceReset) {
          state.lastExpiredResetForceKey = expKey;
          state.lastExpiredResetForceAt = now;
          state.lastQuotaForceAt = now;
          await fetchQuota(true);
        } else {
          await fetchQuota(false);
        }
      }
      scheduleQuotaLoop();
    }, 60000);
  }

  function render(d) {
    const conv = currentConv();
    const key = convKey(conv);
    const isConvSwitch = state.settingsLoadedForConv !== key;
    const isNewConv = state.anim.conv !== key;
    if (isConvSwitch && state.settingsLoadedForConv !== null && hasPendingSettingsChange()) {
      const prevConv = state.settingsLoadedForConv === DRAFT_KEY ? "" : state.settingsLoadedForConv;
      saveAutoSettings(prevConv);
    }
    state.lastData = d;
    if (d.settings) {
      if (isConvSwitch) {
        if (state.pinDragging) {
          cancelPinDrag(false);
        }
        state.settings = d.settings;
        state.settingsDirty = false;
      } else if (!state.pinDragging) {
        state.settings = d.settings;
      }
      if (isConvSwitch || (!state.pinDragging && !state.settingsDirty && !state.settingsSaving && document.activeElement !== $("in-at"))) {
        $("in-auto").checked = Boolean(d.settings.auto_compact_enabled);
        $("in-at").value = Math.round((d.settings.auto_compact_threshold || 250000) / 1000);
        syncThresholdWidth();
        state.settingsLoadedForConv = key;
      }
    }

    syncNotesConv(conv);
    if (isSearching() && state.search.conv !== conv) {
      runChatSearch();
    } else if (!isSearching() && state.search.conv !== conv) {
      state.search.conv = conv;
    }

    if (isConvSwitch) {
      clearUndoDone();
      fetchQuota(false);
    }

    if (d.status !== "ok") {
      applyActiveQuotaGroup("");
      clearCompactPending();
      stopWorkingCompactBtn();
      syncBarFlow(false, false);
      animateMeterTo(key, 0, 0, false);
      if (!state.pinDragging) {
        updateAutoPin(isNewConv);
      }
      $("first-ts").textContent = "—";
      $("last-ts").textContent = "—";
      $("msgs").textContent = "0";
      const cs = $("compact-state");
      cs.className = "compact-state";
      cs.textContent = "Not compacted";
      if (!state.undoDone) {
        $("undo-compact-btn").classList.remove("visible");
      }
      evaluateAutoCompact(d);
      setCompactBtnStatus();
      return;
    }

    if (d.compact_in_flight) {
      clearCompactPending();
      startWorkingCompactBtn();
    } else if (d.just_compressed) {
      clearCompactPending();
      if (state.compactingActive) {
        stopWorkingCompactBtn();
        setCompactBtnStatus("Done!", "is-ok", 2000, "", true);
      }
    } else if (
      state.compactingActive &&
      !d.is_busy &&
      (
        !state.compactPending ||
        (
          state.compactPendingStep !== null &&
          typeof d.step_index === "number" &&
          d.step_index > state.compactPendingStep
        )
      )
    ) {
      clearCompactPending();
      stopWorkingCompactBtn();
      setCompactBtnStatus();
    }

    applyActiveQuotaGroup(d.active_quota_group || "");

    const tokens = d.context_tokens || 0;
    const deltaTokens = d.delta_tokens || 0;
    const hasDelta = Boolean(d.has_delta);

    syncBarFlow(d.is_busy, d.compact_in_flight || state.compactingActive);

    animateMeterTo(key, tokens, deltaTokens, hasDelta);
    if (!state.pinDragging) {
      updateAutoPin(isNewConv);
    }

    $("first-ts").textContent = fmtDateTime(d.first_message_at);
    $("last-ts").textContent = fmtDateTime(d.last_message_at);

    $("msgs").textContent = fmt(d.user_messages || 0);

    const cs = $("compact-state");
    const cpCount = d.checkpoint_count || 0;
    if (cpCount > 0) {
      cs.className = "compact-state yes";
      cs.textContent = cpCount > 1 ? "Compacted ×" + cpCount : "Compacted";
    } else {
      cs.className = "compact-state";
      cs.textContent = "Not compacted";
    }

    const canUndo =
      d.undo_step_index !== null &&
      d.undo_step_index !== undefined &&
      !d.is_busy &&
      !d.compact_in_flight;
    if (canUndo) {
      preloadNativeDoneSound();
    }
    if (state.undoDone) {
      $("undo-compact-btn").classList.add("visible", "is-done");
    } else if (!state.undoInFlight) {
      $("undo-compact-btn").classList.toggle("visible", canUndo);
    }

    const nowBusy = Boolean(d.is_busy || d.compact_in_flight);
    const isBrandNewConv = state.lastQuotaConv === "" && Boolean(conv) && nowBusy && tokens > 0;
    if (state.lastQuotaConv !== conv && !isBrandNewConv) {
      state.lastQuotaConv = conv;
      state.lastQuotaTokens = tokens;
      if (state.quotaActiveTimer) {
        clearTimeout(state.quotaActiveTimer);
        state.quotaActiveTimer = null;
      }
    } else {
      state.lastQuotaConv = conv;
      if (nowBusy && tokens !== state.lastQuotaTokens) {
        state.lastQuotaTokens = tokens;
        const elapsed = Date.now() - state.lastQuotaForceAt;
        if (elapsed >= 15000) {
          triggerForceQuotaNow();
        } else if (!state.quotaActiveTimer) {
          state.quotaActiveTimer = setTimeout(() => {
            state.quotaActiveTimer = null;
            if (state.lastData && (state.lastData.is_busy || state.lastData.compact_in_flight)) {
              triggerForceQuotaNow();
            }
          }, Math.max(250, 15000 - elapsed));
        }
      }
    }
    if (state.wasBusy && !nowBusy) {
      state.lastQuotaTokens = tokens;
      if (state.quotaActiveTimer) {
        clearTimeout(state.quotaActiveTimer);
        state.quotaActiveTimer = null;
      }
      if (state.quotaAfterTurnTimer) clearTimeout(state.quotaAfterTurnTimer);
      state.quotaAfterTurnTimer = setTimeout(() => {
        state.quotaAfterTurnTimer = null;
        triggerForceQuotaNow();
      }, 1500);
    }
    state.wasBusy = nowBusy;

    evaluateAutoCompact(d);
    refreshCompactBtnDisabled();
  }

  async function poll() {
    if (state.timer) {
      clearTimeout(state.timer);
      state.timer = null;
    }
    const myGen = ++state.pollGen;
    const conv = currentConv();
    const aborter = typeof AbortController === "function" ? new AbortController() : null;
    const timeoutId = aborter ? setTimeout(() => {
      try { aborter.abort(); } catch (_) {}
    }, 8000) : null;
    try {
      const q = new URLSearchParams();
      if (conv) q.set("conversationId", conv);
      if (state.etag) q.set("etag", state.etag);
      const opts = { method: "GET" };
      if (aborter) opts.signal = aborter.signal;
      const res = await apiFetch("/api/context?" + q.toString(), opts);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (myGen !== state.pollGen) return;
      if (state.hadNetError) {
        state.hadNetError = false;
        $("total").style.opacity = "1";
      }
      if (!data.unchanged) {
        state.etag = data.etag || "";
        render(data);
      }
    } catch (err) {
      if (myGen !== state.pollGen) return;
      state.hadNetError = true;
      $("total").style.opacity = "0.55";
      syncBarFlow(false, false);
    } finally {
      if (timeoutId) clearTimeout(timeoutId);
      if (myGen === state.pollGen) {
        const delay = document.hidden ? 4000 : (state.lastData && state.lastData.is_busy ? 600 : 1200);
        state.timer = setTimeout(poll, delay);
      }
    }
  }

  window.addEventListener("focus", () => {
    fetchQuota(false);
  });
  window.addEventListener("blur", () => {
    hideTip(true);
    closeCtxMenu();
    cancelAllDeleteConfirms();
    collapseAllNoteCards();
    collapseAllSearchBlocks();
    if (Date.now() >= state.keepAboutUntil) {
      setAboutOpen(false);
    }
    commitSettingsIfNeeded();
    flushNoteSave();
  });
  window.addEventListener("pagehide", () => {
    commitSettingsIfNeeded();
    flushNoteSave({ keepalive: true });
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      hideTip(true);
      closeCtxMenu();
      cancelAllDeleteConfirms();
      collapseAllNoteCards();
      collapseAllSearchBlocks();
      if (Date.now() >= state.keepAboutUntil) {
        setAboutOpen(false);
      }
      commitSettingsIfNeeded();
      flushNoteSave({ keepalive: true });
    } else if (state.timer) {
      clearTimeout(state.timer);
      poll();
      fetchQuota(false);
      maybeCheckForUpdates(false);
    }
  });

  if (typeof ResizeObserver === "function") {
    let lastW = 0;
    let lastH = 0;
    const wsEl = document.querySelector(".workspace-area");
    if (wsEl) {
      const wsRo = new ResizeObserver(() => {
        const w = wsEl.clientWidth;
        const h = wsEl.clientHeight;
        if (!w || !h || (w === lastW && h === lastH)) return;
        lastW = w;
        lastH = h;
        recalcVisibleCardsHeights();
      });
      wsRo.observe(wsEl);
    }
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => recalcVisibleCardsHeights()).catch(() => {});
  }

  syncThresholdWidth();
  syncNotesConv(currentConv());
  poll();
  fetchQuota(false);
  scheduleQuotaLoop();
  maybeCheckForUpdates(true);
})();
</script>
</body>
</html>
